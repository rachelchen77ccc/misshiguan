<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>觅食官 · 美食探店助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --logo-size:              31px;
    --restaurant-name-size:   17px;
    --body-size:              14px;
    --label-size:             13px;
    --title-weight:           600;
    --body-weight:            400;
    --card-padding:           22px;
    --card-gap:               13px;
    --page-margin:            24px;
    --element-gap:            8px;
    --card-radius:            12px;
    --btn-radius:             9px;
    --input-radius:           7px;
    --color-bg:               #F7F3EE;
    --color-card:             #FDFAF6;
    --color-text-main:        #1A1209;
    --color-text-secondary:   #7A6858;
    --color-accent:           #C4622D;
    --color-border:           #E5DDD4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--color-bg);
    height: 100vh;
    overflow: hidden;
    color: var(--color-text-main);
    -webkit-font-smoothing: antialiased;
  }
  body.resizing-sidebar {
    cursor: col-resize;
    user-select: none;
  }

  /* ── APP SHELL ── */
  .app-shell {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #EDE6DC;
    border-right: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.25s ease, opacity 0.2s ease;
  }

  .sidebar.collapsed {
    width: 0;
    opacity: 0;
    pointer-events: none;
  }
  .sidebar-resizer {
    width: 8px;
    flex-shrink: 0;
    cursor: col-resize;
    position: relative;
    background: transparent;
  }
  .sidebar-resizer::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 0;
    width: 1px;
    height: 100%;
    background: rgba(122, 104, 88, 0.14);
    transition: background 0.15s;
  }
  .sidebar-resizer:hover::after,
  body.resizing-sidebar .sidebar-resizer::after {
    background: rgba(196, 98, 45, 0.45);
  }
  .sidebar.collapsed + .sidebar-resizer {
    width: 0;
    pointer-events: none;
  }

  .sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 14px 16px;
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }

  .sidebar-logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--color-text-main);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .new-chat-btn {
    width: 28px;
    height: 28px;
    background: none;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    color: var(--color-text-secondary);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    flex-shrink: 0;
    line-height: 1;
    padding-bottom: 1px;
  }

  .new-chat-btn:hover {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }

  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 6px;
  }

  .sidebar-list::-webkit-scrollbar { width: 3px; }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

  .session-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }

  .session-item:hover { background: rgba(0,0,0,0.05); }

  .session-item.active {
    background: var(--color-card);
    border-color: var(--color-border);
  }

  .session-title {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--color-text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 400;
    min-width: 0;
  }

  .session-del {
    opacity: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: 16px;
    padding: 0 3px;
    line-height: 1;
    border-radius: 3px;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
  }

  .session-item:hover .session-del { opacity: 1; }
  .session-del:hover { color: var(--color-accent); }
  .session-edit {
    opacity: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: 13px;
    padding: 0 3px;
    line-height: 1;
    border-radius: 3px;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .session-item:hover .session-edit { opacity: 1; }
  .session-edit:hover { color: var(--color-accent); }
  .session-item.editing {
    background: var(--color-card);
    border-color: var(--color-border);
    cursor: default;
  }
  .session-rename-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--color-border);
    background: var(--color-bg);
    border-radius: 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--color-text-main);
    padding: 5px 8px;
    outline: none;
  }
  .session-rename-input:focus { border-color: var(--color-accent); }
  .session-rename-save,
  .session-rename-cancel {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: 13px;
    padding: 0 3px;
    line-height: 1;
    border-radius: 3px;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .session-rename-save:hover,
  .session-rename-cancel:hover { color: var(--color-accent); }

  /* ── SIDEBAR OVERLAY (mobile) ── */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 49;
  }

  .sidebar-overlay.visible { display: block; }

  /* ── MAIN AREA ── */
  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* ── HEADER ── */
  header {
    background: var(--color-card);
    border-bottom: 1px solid var(--color-border);
    padding: 16px var(--page-margin);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .hamburger-btn {
    width: 32px;
    height: 32px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 4px;
    border-radius: 6px;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .hamburger-btn:hover { background: var(--color-bg); }

  .hamburger-btn span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--color-text-secondary);
    border-radius: 1px;
  }

  .logo-name {
    font-family: 'Playfair Display', serif;
    font-size: var(--logo-size);
    font-weight: var(--title-weight);
    color: var(--color-text-main);
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .logo-sep {
    width: 1px;
    height: 20px;
    background: var(--color-border);
    flex-shrink: 0;
  }

  .logo-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    font-weight: var(--body-weight);
    letter-spacing: 0.01em;
  }

  .logo-dot {
    margin-left: auto;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--color-accent);
    flex-shrink: 0;
    opacity: 0.7;
  }

  /* ── CHAT AREA ── */
  .chat-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 36px var(--page-margin) 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 980px;
    width: 100%;
    margin: 0 auto;
  }

  .chat-wrap::-webkit-scrollbar { width: 4px; }
  .chat-wrap::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

  /* ── WELCOME ── */
  .welcome {
    padding: 8px 0 4px;
    animation: fadeUp 0.4s ease;
  }

  .welcome-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-accent);
    margin-bottom: 14px;
    opacity: 0.8;
  }

  .welcome h2 {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 500;
    color: var(--color-text-main);
    line-height: 1.2;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }

  .welcome p {
    font-size: var(--body-size);
    color: var(--color-text-secondary);
    line-height: 1.8;
    font-weight: var(--body-weight);
    max-width: 400px;
  }
  .welcome-mode-sub {
    margin-top: 8px;
    max-width: 520px;
  }
  .home-entry-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 18px 0 14px;
    max-width: 640px;
  }
  .home-entry-card {
    border: 1px solid var(--color-border);
    background: var(--color-card);
    border-radius: 14px;
    padding: 14px 14px 13px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  .home-entry-card:hover {
    border-color: #DFC8B7;
    background: #FBF7F2;
    transform: translateY(-1px);
  }
  .home-entry-card.active {
    border-color: #E3B89B;
    background: #FFF5EF;
  }
  .home-entry-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    color: var(--color-text-main);
    line-height: 1.2;
    margin-bottom: 5px;
    letter-spacing: -0.01em;
  }
  .home-entry-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.6;
  }
  .decide-result-card {
    margin-top: 14px;
    max-width: 520px;
    border: 1px solid #E7D8CC;
    background: #FFF7F1;
    border-radius: 14px;
    padding: 14px 15px 13px;
    animation: fadeUp 0.2s ease;
  }
  .decide-result-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .decide-result-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    line-height: 1.35;
    color: var(--color-text-main);
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .decide-result-direction {
    display: inline-block;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    line-height: 1;
    color: var(--color-accent);
    border: 1px solid #E7C5B0;
    background: #FFF3EA;
    border-radius: 999px;
    padding: 4px 9px;
    margin-bottom: 8px;
  }
  .decide-result-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.7;
    margin-bottom: 10px;
  }
  .decide-result-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .decide-cta-btn,
  .decide-ghost-btn {
    border-radius: 999px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1;
    padding: 8px 12px;
    cursor: pointer;
    transition: opacity 0.15s, background 0.15s, border-color 0.15s, color 0.15s;
  }
  .decide-cta-btn {
    border: 1px solid #E3B89B;
    background: #FFF1E8;
    color: var(--color-accent);
  }
  .decide-cta-btn:hover { opacity: 0.85; }
  .decide-cta-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .decide-ghost-btn {
    border: 1px solid var(--color-border);
    background: var(--color-card);
    color: var(--color-text-secondary);
  }
  .decide-ghost-btn:hover { background: var(--color-bg); }
  .decide-ghost-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .decide-wheel-card {
    margin-top: 12px;
    max-width: 560px;
    border: 1px solid var(--color-border);
    background: linear-gradient(165deg, #FCF8F2 0%, #F7F1E9 100%);
    border-radius: 16px;
    padding: 14px 14px 12px;
  }
  .decide-wheel-head {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    line-height: 1.25;
    color: var(--color-text-main);
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }
  .decide-wheel-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .decide-wheel-wrap {
    width: 260px;
    height: 260px;
    margin: 0 auto 10px;
    position: relative;
  }
  .decide-wheel-pointer {
    position: absolute;
    left: 50%;
    top: -6px;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 13px solid #C4622D;
    z-index: 3;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.12));
  }
  .decide-wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 1px solid #E5D5C9;
    position: relative;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0) 0 36%, rgba(255,255,255,0.65) 36% 38%, rgba(255,255,255,0) 38% 100%),
      conic-gradient(from -12deg, #F2DED0, #F9E8D9, #F3DBC7, #E9D4C7, #F4E3D3, #EED7C8, #F7E7D8, #EAD6C9, #F2DED0);
    box-shadow: inset 0 0 0 8px rgba(255,255,255,0.62), 0 6px 20px rgba(98,71,46,0.08);
  }
  .decide-wheel.spinning {
    box-shadow: inset 0 0 0 8px rgba(255,255,255,0.62), 0 10px 26px rgba(98,71,46,0.15);
  }
  .decide-wheel-seg {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 90px;
    margin-left: -45px;
    transform: rotate(var(--a)) translateY(-106px) rotate(calc(-1 * var(--a)));
    text-align: center;
  }
  .decide-wheel-seg span {
    display: inline-block;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    line-height: 1.2;
    color: #6C5B4B;
    background: rgba(255,255,255,0.72);
    border: 1px solid rgba(208,188,172,0.8);
    border-radius: 999px;
    padding: 4px 8px;
    max-width: 88px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .decide-wheel-seg.active span {
    border-color: #E3B89B;
    color: var(--color-accent);
    background: #FFF3EA;
  }
  .decide-wheel-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid #E2CEC0;
    background: #FFF9F2;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 23px;
    color: #9C7A63;
    letter-spacing: 0.02em;
  }
  .decide-wheel-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 22px;
  }

  .chip {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    border: 1px solid var(--color-border);
    background: var(--color-card);
    padding: 6px 16px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    font-weight: var(--body-weight);
    line-height: 1.4;
  }

  .chip:hover {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }

  /* ── MESSAGE ROWS ── */
  .msg-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    animation: fadeUp 0.25s ease;
  }

  .msg-row.user { flex-direction: row-reverse; }

  .av {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--color-border);
    background: var(--color-card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-secondary);
    flex-shrink: 0;
    letter-spacing: -0.01em;
    margin-top: 2px;
  }

  .user-av {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }

  .user-bubble {
    max-width: 58%;
    background: var(--color-accent);
    color: white;
    border-radius: var(--btn-radius);
    padding: 10px 16px;
    font-size: var(--body-size);
    line-height: 1.65;
    font-weight: var(--body-weight);
    font-family: 'DM Sans', sans-serif;
  }

  .plain-bubble {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--btn-radius);
    padding: 10px 16px;
    font-size: var(--body-size);
    line-height: 1.8;
    color: var(--color-text-secondary);
    font-weight: var(--body-weight);
    font-family: 'DM Sans', sans-serif;
  }

  .bot-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }

  /* ── TYPING INDICATOR ── */
  .typing-dots {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 3px 0;
  }

  .typing-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--color-accent);
    opacity: 0.25;
    animation: dotPulse 1.4s ease-in-out infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 60%, 100% { opacity: 0.25; transform: scale(1); }
    30%           { opacity: 0.9;  transform: scale(1.25); }
  }

  /* ── CARDS GRID ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--card-gap);
  }

  /* ── RESTAURANT CARD ── */
  .r-card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--card-radius);
    padding: var(--card-padding);
    animation: fadeUp 0.3s ease both;
    transition: border-color 0.2s;
  }

  .r-card:hover { border-color: #CCADA0; }

  .card-index {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--color-border);
    letter-spacing: 0.06em;
    margin-bottom: var(--element-gap);
  }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: var(--restaurant-name-size);
    font-weight: var(--title-weight);
    color: var(--color-text-main);
    line-height: 1.3;
    margin-bottom: var(--element-gap);
    letter-spacing: -0.005em;
  }

  .card-rating {
    display: flex;
    align-items: baseline;
    gap: 5px;
    margin-bottom: var(--element-gap);
  }

  .card-stars {
    color: var(--color-accent);
    font-size: 11px;
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .card-score {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    font-weight: var(--body-weight);
  }

  .card-meta {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    margin-bottom: calc(var(--element-gap) * 0.6);
    line-height: 1.5;
    font-weight: var(--body-weight);
  }

  .meta-icon {
    flex-shrink: 0;
    font-size: 11px;
    opacity: 0.5;
    margin-top: 1px;
  }

  .card-divider {
    border: none;
    border-top: 1px solid var(--color-border);
    margin: calc(var(--element-gap) * 1.2) 0;
    opacity: 0.7;
  }

  .card-quote {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: var(--body-size);
    color: var(--color-text-secondary);
    line-height: 1.7;
    border-left: 2px solid var(--color-accent);
    padding-left: 12px;
    margin-bottom: var(--element-gap);
    font-weight: 400;
  }

  .card-link {
    display: inline-block;
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--color-border);
    transition: color 0.15s, text-decoration-color 0.15s;
    font-weight: var(--body-weight);
    cursor: pointer;
  }

  .card-link:hover {
    color: var(--color-accent);
    text-decoration-color: var(--color-accent);
  }

  /* ── ERROR BUBBLE ── */
  .error-bubble {
    background: #FDF3EE;
    border: 1px solid #F0C4A8;
    border-radius: var(--btn-radius);
    padding: 14px 16px;
    max-width: 380px;
  }

  .error-title {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--body-size);
    font-weight: 500;
    color: var(--color-text-main);
    margin-bottom: 5px;
  }

  .error-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .error-retry {
    background: var(--color-accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 7px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .error-retry:hover { opacity: 0.82; }

  /* ── INPUT BAR ── */
  .input-bar {
    background: var(--color-card);
    border-top: 1px solid var(--color-border);
    padding: 14px var(--page-margin) 20px;
    flex-shrink: 0;
  }
  .mode-switch {
    max-width: 980px;
    margin: 0 auto 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--color-border);
    border-radius: 999px;
    background: var(--color-bg);
    padding: 4px;
  }
  .mode-switch-btn {
    border: none;
    background: transparent;
    color: var(--color-text-secondary);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1;
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, opacity 0.15s;
    opacity: 0.85;
    white-space: nowrap;
  }
  .mode-switch-btn.active {
    background: #FFF3EE;
    color: var(--color-accent);
    opacity: 1;
  }
  .mode-switch-btn:hover { opacity: 1; }

  .input-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    border: 1px solid var(--color-border);
    border-radius: var(--input-radius);
    padding: 11px 15px;
    font-family: 'DM Sans', sans-serif;
    font-size: var(--body-size);
    color: var(--color-text-main);
    background: var(--color-bg);
    resize: none;
    outline: none;
    line-height: 1.55;
    min-height: 44px;
    max-height: 130px;
    transition: border-color 0.15s;
    font-weight: var(--body-weight);
    -webkit-font-smoothing: antialiased;
  }

  textarea:focus { border-color: var(--color-accent); }

  textarea::placeholder {
    color: var(--color-text-secondary);
    opacity: 0.55;
  }

  .send-btn {
    width: 44px;
    height: 44px;
    background: var(--color-accent);
    border: none;
    border-radius: var(--btn-radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }

  .send-btn:hover  { opacity: 0.82; }
  .send-btn:active { opacity: 0.68; }
  .send-btn:disabled { opacity: 0.22; cursor: not-allowed; }

  .send-btn svg {
    width: 17px; height: 17px;
    fill: none; stroke: white;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }

  .foot-note {
    text-align: center;
    font-size: 11px;
    color: var(--color-text-secondary);
    opacity: 0.45;
    margin-top: 9px;
    font-weight: var(--body-weight);
    letter-spacing: 0.03em;
  }

  /* ── ANIMATION ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: translateY(0);   }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      z-index: 50;
      transform: translateX(-100%);
      width: 240px !important;
      opacity: 1 !important;
      pointer-events: none;
      transition: transform 0.25s ease;
    }
    .sidebar-resizer { display: none; }

    .sidebar.mobile-open {
      transform: translateX(0);
      pointer-events: auto;
    }
  }

  @media (max-width: 720px) {
    .cards-grid { grid-template-columns: 1fr 1fr; }
    .chat-wrap  { padding: 24px 16px 20px; }
    .input-bar  { padding: 12px 16px 18px; }
    .home-entry-grid { grid-template-columns: 1fr; max-width: 460px; }
    .decide-wheel-wrap { width: 236px; height: 236px; }
    .decide-wheel-seg { transform: rotate(var(--a)) translateY(-96px) rotate(calc(-1 * var(--a))); }
  }

  @media (max-width: 480px) {
    .cards-grid { grid-template-columns: 1fr; }

    /* Mobile card fold: hide cards beyond #3 until user expands */
    .mobile-fold { display: none; }

    /* Sidebar: use small viewport height to avoid iOS URL-bar overlap */
    .sidebar { height: 100svh; }

    /* Input bar: add iPhone home indicator clearance */
    .input-bar {
      padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    }

    /* Header: reclaim horizontal space on small screens */
    header { padding: 11px 14px; }
    .logo-sub, .logo-sep { display: none; }

    /* Cards: tighter padding on mobile */
    .r-card { padding: 16px; }

    /* Chat wrap: less top breathing room on small screens */
    .chat-wrap { padding-top: 20px; }
  }

  /* ── FOLLOW-UP CHIPS ── */
  .follow-up-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
    animation: fadeUp 0.3s ease;
  }

  .follow-up-chip {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    border: 1px solid var(--color-border);
    background: var(--color-card);
    padding: 6px 16px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    font-weight: var(--body-weight);
    line-height: 1.4;
    white-space: nowrap;
  }

  .follow-up-chip:hover {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }

  /* ── CARD FAV BUTTON ── */
  .r-card { position: relative; }

  .fav-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 26px;
    height: 26px;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--color-text-secondary);
    opacity: 0;
    transition: opacity 0.15s, background 0.15s, border-color 0.15s, color 0.15s;
    line-height: 1;
    padding: 0;
  }
  .r-card:hover .fav-btn { opacity: 1; }
  .fav-btn.saved { opacity: 1; color: var(--color-accent); border-color: #F0C4A8; background: #FFF3EE; }
  .fav-btn:hover { background: var(--color-accent) !important; color: white !important; border-color: var(--color-accent) !important; opacity: 1; }

  /* ── FAV POPOVER OVERLAY ── */
  .fav-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,18,9,0.38);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .fav-overlay.open { display: flex; }

  .fav-panel {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: 14px;
    padding: 22px 20px 18px;
    width: 300px;
    max-width: calc(100vw - 40px);
    box-shadow: 0 8px 36px rgba(0,0,0,0.14);
    animation: fadeUp 0.2s ease;
    position: relative;
  }
  .fav-panel-close {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    border-radius: 6px;
    color: var(--color-text-secondary);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
  }
  .fav-panel-close:hover {
    opacity: 1;
    color: var(--color-accent);
    background: var(--color-bg);
  }

  .fav-panel-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--color-text-main);
    margin-bottom: 4px;
  }

  .fav-panel-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-bottom: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .fav-collections-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 190px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .fav-collections-list::-webkit-scrollbar { width: 3px; }
  .fav-collections-list::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

  .fav-coll-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
    user-select: none;
  }
  .fav-coll-item:hover { background: var(--color-bg); }

  .fav-coll-check {
    width: 17px;
    height: 17px;
    border: 1.5px solid var(--color-border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 10px;
    color: white;
    background: white;
    transition: background 0.15s, border-color 0.15s;
  }
  .fav-coll-item.checked .fav-coll-check {
    background: var(--color-accent);
    border-color: var(--color-accent);
  }

  .fav-coll-label { font-size: 14px; color: var(--color-text-main); flex: 1; }
  .fav-coll-count-badge { font-size: 11px; color: var(--color-text-secondary); opacity: 0.55; }

  .fav-new-row {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--color-border);
  }
  .fav-new-input {
    flex: 1;
    border: 1px solid var(--color-border);
    border-radius: var(--input-radius);
    padding: 8px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: var(--color-bg);
    color: var(--color-text-main);
    outline: none;
    transition: border-color 0.15s;
    min-width: 0;
  }
  .fav-new-input:focus { border-color: var(--color-accent); }
  .fav-new-input::placeholder { color: var(--color-text-secondary); opacity: 0.5; }

  .fav-new-btn {
    background: var(--color-accent);
    color: white;
    border: none;
    border-radius: var(--btn-radius);
    padding: 8px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .fav-new-btn:hover { opacity: 0.85; }

  .fav-empty-hint {
    font-size: 13px;
    color: var(--color-text-secondary);
    text-align: center;
    padding: 12px 0 8px;
    opacity: 0.6;
  }

  /* ── SIDEBAR FAVORITES ENTRY ── */
  .sidebar-fav-divider {
    height: 1px;
    background: var(--color-border);
    margin: 4px 10px;
    opacity: 0.7;
    flex-shrink: 0;
  }
  .sidebar-fav-entry {
    margin: 4px 6px 10px;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--color-text-secondary);
    border: 1px solid transparent;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    flex-shrink: 0;
    user-select: none;
  }
  .sidebar-fav-entry:hover { background: rgba(0,0,0,0.05); }
  .sidebar-fav-entry.active {
    background: var(--color-card);
    border-color: var(--color-border);
    color: var(--color-accent);
    font-weight: 500;
  }

  /* ── FAVORITES VIEW ── */
  .fav-view {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 36px var(--page-margin) 28px;
    max-width: 980px;
    width: 100%;
    margin: 0 auto;
  }
  .fav-view.active { display: block; }
  .fav-view::-webkit-scrollbar { width: 4px; }
  .fav-view::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

  .fav-view-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 500;
    color: var(--color-text-main);
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .fav-view-sub { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 28px; opacity: 0.7; }

  .fav-coll-section {
    margin-bottom: 20px;
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--card-radius);
    overflow: hidden;
    animation: fadeUp 0.25s ease;
  }

  .fav-coll-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .fav-coll-header:hover { background: var(--color-bg); }
  .fav-coll-section.expanded .fav-coll-header { border-bottom: 1px solid var(--color-border); }
  .fav-coll-name {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--color-text-main);
    flex: 1;
  }
  .fav-coll-badge {
    font-size: 11px;
    color: var(--color-text-secondary);
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: 100px;
    padding: 2px 9px;
  }
  .fav-coll-del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: 18px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color 0.15s, opacity 0.15s;
    opacity: 0.35;
  }
  .fav-coll-del-btn:hover { color: var(--color-accent); opacity: 1; }
  .fav-coll-edit-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: 14px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color 0.15s, opacity 0.15s;
    opacity: 0.4;
  }
  .fav-coll-edit-btn:hover { color: var(--color-accent); opacity: 1; }
  .fav-coll-toggle {
    font-size: 11px;
    color: var(--color-text-secondary);
    opacity: 0.75;
    transition: transform 0.15s ease;
    line-height: 1;
  }
  .fav-coll-section.expanded .fav-coll-toggle { transform: rotate(180deg); }

  .fav-coll-delete-confirm {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    border-top: 1px solid var(--color-border);
    background: var(--color-bg);
  }
  .fav-coll-delete-text {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.5;
  }
  .fav-coll-delete-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .fav-coll-confirm-btn,
  .fav-coll-cancel-btn {
    border-radius: 999px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    line-height: 1;
    padding: 8px 12px;
    transition: opacity 0.15s, background 0.15s, border-color 0.15s, color 0.15s;
  }
  .fav-coll-confirm-btn {
    border: 1px solid #E9BCA0;
    background: #FFF3EE;
    color: var(--color-accent);
  }
  .fav-coll-confirm-btn:hover { opacity: 0.85; }
  .fav-coll-cancel-btn {
    border: 1px solid var(--color-border);
    background: var(--color-card);
    color: var(--color-text-secondary);
  }
  .fav-coll-cancel-btn:hover { background: var(--color-bg); }
  .fav-coll-rename-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--color-border);
    background: var(--color-bg);
  }
  .fav-coll-rename-input {
    flex: 1;
    border: 1px solid var(--color-border);
    border-radius: 999px;
    background: var(--color-card);
    color: var(--color-text-main);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    min-width: 0;
  }
  .fav-coll-rename-input:focus { border-color: var(--color-accent); }
  .fav-coll-rename-save,
  .fav-coll-rename-cancel {
    border-radius: 999px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    padding: 8px 12px;
    transition: opacity 0.15s, background 0.15s;
  }
  .fav-coll-rename-save {
    border: 1px solid #E9BCA0;
    background: #FFF3EE;
    color: var(--color-accent);
  }
  .fav-coll-rename-save:hover { opacity: 0.85; }
  .fav-coll-rename-cancel {
    border: 1px solid var(--color-border);
    background: var(--color-card);
    color: var(--color-text-secondary);
  }
  .fav-coll-rename-cancel:hover { background: var(--color-bg); }

  .fav-rest-row {
    display: flex;
    align-items: flex-start;
    padding: 13px 18px;
    gap: 10px;
    border-bottom: 1px solid var(--color-border);
    transition: background 0.12s;
  }
  .fav-rest-row:last-child { border-bottom: none; }
  .fav-rest-row:hover { background: var(--color-bg); }

  .fav-rest-info { flex: 1; min-width: 0; }
  .fav-rest-name {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--color-text-main);
    margin-bottom: 4px;
  }
  .fav-rest-meta { font-size: 12px; color: var(--color-text-secondary); line-height: 1.7; }
  .fav-rest-link {
    display: inline-block;
    font-size: 12px;
    color: var(--color-text-secondary);
    text-decoration: underline;
    text-underline-offset: 2px;
    text-decoration-color: var(--color-border);
    cursor: pointer;
    transition: color 0.15s;
    margin-top: 3px;
  }
  .fav-rest-link:hover { color: var(--color-accent); text-decoration-color: var(--color-accent); }
  .fav-rest-del {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: 16px;
    padding: 1px 4px;
    border-radius: 4px;
    opacity: 0.35;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
    margin-top: 2px;
    line-height: 1;
  }
  .fav-rest-del:hover { opacity: 1; color: var(--color-accent); }

  .fav-empty-state {
    text-align: center;
    padding: 60px 20px 40px;
    animation: fadeUp 0.3s ease;
  }
  .fav-empty-icon { font-size: 38px; margin-bottom: 16px; opacity: 0.3; }
  .fav-empty-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--color-text-main);
    margin-bottom: 8px;
  }
  .fav-empty-sub { font-size: 13px; color: var(--color-text-secondary); opacity: 0.65; line-height: 1.7; }
  .fav-hint {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    max-width: calc(100vw - 36px);
    background: rgba(122, 104, 88, 0.86);
    color: #FFF7F1;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 9px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1.2;
    letter-spacing: 0.01em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s;
    z-index: 260;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fav-hint.show { opacity: 1; }

  /* ── RESTAURANT GROUP (share button row) ── */
  .restaurant-group {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .restaurant-group-header {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
  }

  .share-group-btn {
    background: transparent;
    border: 1px solid var(--color-border);
    border-radius: 100px;
    padding: 4px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-secondary);
    cursor: pointer;

<script>
const WEBHOOK_URL = 'https://rayrayonthemove.app.n8n.cloud/webhook/86b2b344-ceaa-4601-92b8-2dc810150356/chat';
const STORAGE_KEY = 'misshiguan_sessions_v2';
const SIDEBAR_WIDTH_KEY = 'misshiguan_sidebar_width_v1';
const SIDEBAR_MIN_WIDTH = 208;
const SIDEBAR_MAX_WIDTH = 360;

let sessions = [];
let currentSessionId = null;
let busy = false;
let currentView = 'chat'; // 'chat' | 'favorites'
let currentMode = 'recommend'; // 'recommend' | 'decide'
let sessionRenamingId = null;
let sessionRenameDraft = '';
let sidebarWidth = 240;
let isSidebarResizing = false;

const FAVS_KEY = 'misshiguan_favorites_v2';
let _favPopoverRestaurant = null;
let favExpandedCollection = null;
let favPendingDeleteCollection = null;
let favRenamingCollection = null;
let favRenameDraft = '';

const RECOMMEND_PLACEHOLDER = '例如：帮我找广州珠江新城适合约会的粤菜…';
const DECIDE_PLACEHOLDER = '例如：帮我决定今天吃什么，想吃便宜又热乎的…';
const RECOMMEND_WELCOME_CHIPS = [
  '上海外滩高档餐厅',
  '北京三里屯咖啡厅',
  '成都平价川菜',
  'Berlin brunch spots'
];
const DECIDE_CHIPS = [
  '想吃热乎的',
  '想吃便宜点',
  '想吃开心一点',
  '想吃清淡点',
  '想吃有氛围的',
  '完全随机'
];
const DECIDE_MAJOR_CUISINES = ['中餐', '日料', '韩餐', '法餐', '意餐', '东南亚菜', '南亚菜', '地中海菜', '美式', '墨西哥菜'];
const DECIDE_CHINESE_REGIONAL = ['云南菜', '贵州菜', '川菜', '湘菜', '粤菜', '江浙菜', '东北菜', '西北菜', '潮汕菜', '客家菜', '新疆菜'];
const DECIDE_FORMAT_TYPES = ['火锅', '烧烤', '面食', '饺子', '盖饭', 'brunch', '快餐', '素食', '小酒馆', '汤面', '日式定食', '烤肉'];
const DECIDE_SCENE_STYLES = ['热乎的', '重口的', '清淡的', '治愈的', '适合一个人', '适合朋友聚餐', '适合约会'];
let decideResult = null;
let decideStarterActive = false;
let decideRecentResultIds = [];
let decideWheelOptions = [];
let decideWheelRotation = 0;
let decideWheelHighlight = -1;
let decideWheelSpinning = false;
let decideWheelTimer = null;

function createDecideEntry(text, direction, tags) {
  return { id: `${direction}|${text}`, text, direction, tags };
}

function buildDecideDecisionPool() {
  const out = [];
  DECIDE_MAJOR_CUISINES.forEach(c => {
    out.push(createDecideEntry(`要不试试${c}`, c, ['random', 'vibe']));
    out.push(createDecideEntry(`今天适合来一顿${c}`, c, ['random']));
  });
  DECIDE_CHINESE_REGIONAL.forEach(c => {
    out.push(createDecideEntry(`今天适合吃点${c}`, c, ['random', 'hot']));
    out.push(createDecideEntry(`要不换个口味试试${c}`, c, ['random', 'vibe']));
  });
  DECIDE_FORMAT_TYPES.forEach(t => {
    out.push(createDecideEntry(`今天来点${t}怎么样`, t, ['random']));
    out.push(createDecideEntry(`要不就吃${t}，省心也满足`, t, ['cheap', 'comfort']));
  });
  DECIDE_SCENE_STYLES.forEach(s => {
    out.push(createDecideEntry(`今天适合吃点${s}的`, s, ['random']));
  });
  DECIDE_CHINESE_REGIONAL.forEach(c => {
    out.push(createDecideEntry(`今天适合吃点热乎的${c}`, c, ['hot', 'comfort']));
    out.push(createDecideEntry(`预算友好点的话，${c}会比较稳`, c, ['cheap']));
  });
  ['日式定食', '汤面', '素食', 'brunch', '粤菜', '江浙菜', '东南亚菜'].forEach(x => {
    out.push(createDecideEntry(`今天适合一个人吃点${x}`, x, ['solo', 'light']));
  });
  ['烧烤', '火锅', '韩餐', '小酒馆', '川菜'].forEach(x => {
    out.push(createDecideEntry(`要不约朋友吃${x}，气氛更到位`, x, ['group', 'happy', 'vibe']));
  });
  ['法餐', '意餐', '地中海菜', '日料', 'brunch'].forEach(x => {
    out.push(createDecideEntry(`今天想要点氛围感，可以试试${x}`, x, ['date', 'vibe']));
  });
  ['云南菜', '贵州菜', '新疆菜', '墨西哥菜', '南亚菜'].forEach(x => {
    out.push(createDecideEntry(`想吃重口一点的话，${x}挺带劲`, x, ['heavy', 'happy']));
  });
  ['粤菜', '江浙菜', '日料', '素食', '汤面', '东南亚菜'].forEach(x => {
    out.push(createDecideEntry(`今天走清淡路线，${x}会舒服很多`, x, ['light', 'comfort']));
  });
  return out;
}

const DECIDE_DECISION_POOL = buildDecideDecisionPool();

/* ── FAVORITES HELPERS ── */
function loadFavs() {
  try { const r = localStorage.getItem(FAVS_KEY); return r ? JSON.parse(r) : {}; } catch { return {}; }
}
function saveFavs(f) {
  try { localStorage.setItem(FAVS_KEY, JSON.stringify(f)); } catch {}
}
function favKey(name, address) {
  return (name || '').trim() + '||' + (address || '').trim();
}
function isFavorited(name, address) {
  const k = favKey(name, address);
  return Object.values(loadFavs()).some(list => list.some(r => favKey(r.name, r.address) === k));
}
function getRestaurantCollections(name, address) {
  const k = favKey(name, address), f = loadFavs();
  return Object.keys(f).filter(c => f[c].some(r => favKey(r.name, r.address) === k));
}
function setRestaurantInCollection(restaurant, collName, shouldAdd) {
  const f = loadFavs(), k = favKey(restaurant.name, restaurant.address);
  if (!f[collName]) f[collName] = [];
  const idx = f[collName].findIndex(r => favKey(r.name, r.address) === k);
  if (shouldAdd) {
    if (idx === -1) f[collName].push({ name: restaurant.name, rating: restaurant.rating, address: restaurant.address, mapUrl: restaurant.mapUrl, savedAt: Date.now() });
  } else {
    if (idx !== -1) f[collName].splice(idx, 1);
    if (f[collName].length === 0) delete f[collName];
  }
  saveFavs(f);
}
function addToNewCollection(collName, restaurant) {
  collName = collName.trim(); if (!collName) return false;
  const f = loadFavs(), k = favKey(restaurant.name, restaurant.address);
  if (!f[collName]) f[collName] = [];
  let added = false;
  if (!f[collName].some(r => favKey(r.name, r.address) === k)) {
    f[collName].push({ name: restaurant.name, rating: restaurant.rating, address: restaurant.address, mapUrl: restaurant.mapUrl, savedAt: Date.now() });
    added = true;
  }
  saveFavs(f); return added;
}

/* ── UTILS ── */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function scroll() {
  const c = document.getElementById('chatWrap');
  setTimeout(() => c.scrollTop = c.scrollHeight, 60);
}

function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 130) + 'px';
}

function isRateLimitError(text) {
  const lower = text.toLowerCase();
  return lower.includes('error in workflow') || lower.includes('rate limit') || lower.includes('too many requests');
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function pickNoRepeatDecision(candidates) {
  const source = candidates.length > 0 ? candidates : DECIDE_DECISION_POOL;
  const fresh = source.filter(item => !decideRecentResultIds.includes(item.id));
  const chosen = pickRandom(fresh.length > 0 ? fresh : source);
  decideRecentResultIds.push(chosen.id);
  if (decideRecentResultIds.length > 14) decideRecentResultIds.shift();
  return chosen;
}

function createWheelOptions() {
  const copied = [...DECIDE_DECISION_POOL];
  copied.sort(() => Math.random() - 0.5);
  return copied.slice(0, 8);
}

function ensureWheelOptions() {
  if (decideWheelOptions.length === 0) decideWheelOptions = createWheelOptions();
}

function clearDecideWheelTimer() {
  if (!decideWheelTimer) return;
  clearTimeout(decideWheelTimer);
  decideWheelTimer = null;
}

function resetDecideStarter() {
  clearDecideWheelTimer();
  decideResult = null;
  decideWheelRotation = 0;
  decideWheelHighlight = -1;
  decideWheelSpinning = false;
  decideWheelOptions = createWheelOptions();
}

function filterDecidePoolByLabel(label) {
  const tagMap = {
    '想吃热乎的': ['hot', 'comfort'],
    '想吃便宜点': ['cheap'],
    '想吃开心一点': ['happy', 'group', 'heavy'],
    '想吃清淡点': ['light', 'solo'],
    '想吃有氛围的': ['vibe', 'date']
  };
  const tags = tagMap[label] || ['random'];
  const candidates = DECIDE_DECISION_POOL.filter(item => item.tags.some(tag => tags.includes(tag)));
  return candidates.length > 0 ? candidates : DECIDE_DECISION_POOL;
}

function buildDecideResult(label, fixedEntry) {
  const noteMap = {
    '想吃热乎的': '给你挑了个更暖胃的方向。',
    '想吃便宜点': '给你偏向预算友好的选择。',
    '想吃开心一点': '给你偏热闹、有满足感的吃法。',
    '想吃清淡点': '给你偏轻盈、没负担的方向。',
    '想吃有氛围的': '给你偏氛围感更好的方向。',
    '完全随机': '这次就交给命运签。',
  };
  const picked = fixedEntry || pickNoRepeatDecision(label === '完全随机' ? DECIDE_DECISION_POOL : filterDecidePoolByLabel(label));
  return {
    id: picked.id,
    source: label,
    text: picked.text,
    direction: picked.direction,
    note: noteMap[label] || '先定一个方向，再继续找店。'
  };
}

function buildFindByCuisinePrompt(result) {
  const direction = result && result.direction ? result.direction : '今天状态合适的方向';
  return `按「${direction}」这个方向帮我找餐厅，我接下来会补充城市或位置`;
}

function chooseDecideChip(label) {
  if (label === '完全随机') return;
  decideResult = buildDecideResult(label);
  decideWheelHighlight = -1;
  if (currentView === 'chat' && decideStarterActive) renderMessages();
}

function runDecideWheel(welcomeEl) {
  if (decideWheelSpinning) return;
  ensureWheelOptions();
  decideWheelSpinning = true;
  const wheel = welcomeEl.querySelector('.decide-wheel');
  const segCount = decideWheelOptions.length;
  const step = 360 / segCount;
  const picked = pickNoRepeatDecision(decideWheelOptions);
  const idx = decideWheelOptions.findIndex(item => item.id === picked.id);
  const centerAngle = idx * step + step / 2;
  const alignToPointer = 360 - centerAngle;
  const jitter = Math.random() * 8 - 4;
  const targetRotation = decideWheelRotation + 1260 + alignToPointer + jitter;
  if (wheel) {
    wheel.style.transition = 'transform 1500ms cubic-bezier(0.2, 0.8, 0.15, 1)';
    requestAnimationFrame(() => { wheel.style.transform = `rotate(${targetRotation}deg)`; });
  }
  clearDecideWheelTimer();
  decideWheelTimer = setTimeout(() => {
    decideWheelSpinning = false;
    decideWheelRotation = targetRotation;
    decideWheelHighlight = idx;
    decideResult = buildDecideResult('完全随机', picked);
    renderMessages();
  }, 1550);
}

function openDecideStarter() {
  currentMode = 'decide';
  decideStarterActive = true;
  resetDecideStarter();
  syncModeUI();
  if (currentView === 'chat') renderMessages();
}

function syncModeUI() {
  const inp = document.getElementById('inp');
  if (inp) inp.placeholder = currentMode === 'decide' ? DECIDE_PLACEHOLDER : RECOMMEND_PLACEHOLDER;
  const modeSwitch = document.getElementById('modeSwitch');
  if (modeSwitch) {
    modeSwitch.querySelectorAll('.mode-switch-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === currentMode);
    });
  }
}

function setAppMode(mode) {
  if (mode !== 'recommend' && mode !== 'decide') return;
  if (mode === 'decide') {
    openDecideStarter();
    return;
  }
  const shouldRender = currentMode !== 'recommend' || decideStarterActive;
  currentMode = 'recommend';
  decideStarterActive = false;
  clearDecideWheelTimer();
  decideWheelSpinning = false;
  syncModeUI();
  if (currentView === 'chat' && shouldRender) renderMessages();
}

function cancelSessionRename() {
  sessionRenamingId = null;
  sessionRenameDraft = '';
}

function saveSessionRename(id) {
  const session = sessions.find(s => s.id === id);
  if (!session) return;
  const nextTitle = sessionRenameDraft.trim();
  if (nextTitle) session.title = nextTitle.slice(0, 40);
  cancelSessionRename();
  saveSessions();
  renderSidebar();
}

function clampSidebarWidth(w) {
  return Math.max(SIDEBAR_MIN_WIDTH, Math.min(SIDEBAR_MAX_WIDTH, w));
}

function loadSidebarWidth() {
  try {
    const raw = localStorage.getItem(SIDEBAR_WIDTH_KEY);
    const parsed = raw ? parseInt(raw, 10) : 240;
    sidebarWidth = clampSidebarWidth(Number.isFinite(parsed) ? parsed : 240);
  } catch {
    sidebarWidth = 240;
  }
}

function applySidebarWidth() {
  const sidebar = document.getElementById('sidebar');
  if (!sidebar) return;
  if (window.innerWidth < 900) {
    sidebar.style.width = '';
    return;
  }
  if (sidebar.classList.contains('collapsed')) {
    sidebar.style.width = '0px';
    return;
  }
  sidebar.style.width = `${clampSidebarWidth(sidebarWidth)}px`;
}

function saveSidebarWidth() {
  try { localStorage.setItem(SIDEBAR_WIDTH_KEY, String(clampSidebarWidth(sidebarWidth))); } catch {}
}

function initSidebarResize() {
  const resizer = document.getElementById('sidebarResizer');
  const sidebar = document.getElementById('sidebar');
  if (!resizer || !sidebar) return;

  resizer.addEventListener('mousedown', e => {
    if (window.innerWidth < 900) return;
    if (sidebar.classList.contains('collapsed')) return;
    isSidebarResizing = true;
    document.body.classList.add('resizing-sidebar');
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!isSidebarResizing) return;
    sidebarWidth = clampSidebarWidth(e.clientX);
    applySidebarWidth();
  });

  document.addEventListener('mouseup', () => {
    if (!isSidebarResizing) return;
    isSidebarResizing = false;
    document.body.classList.remove('resizing-sidebar');
    saveSidebarWidth();
  });

  window.addEventListener('resize', () => {
    if (window.innerWidth < 900 && isSidebarResizing) {
      isSidebarResizing = false;
      document.body.classList.remove('resizing-sidebar');
    }
    applySidebarWidth();
  });
}

/* ── SESSION MANAGEMENT ── */
function loadSessions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    sessions = Array.isArray(parsed) ? parsed : [];
  } catch {
    sessions = [];
  }
}

function saveSessions() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); } catch {}
}

function getCurrentSession() {
  return sessions.find(s => s.id === currentSessionId) || null;
}

function createNewSession() {
  cancelSessionRename();
  decideStarterActive = false;
  resetDecideStarter();
  const session = {
    id: 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
    title: '新对话',
    messages: [],
    sid: 'sid_' + Math.random().toString(36).substr(2, 9)
  };
  sessions.push(session);
  saveSessions();
  currentSessionId = session.id;
  showChatView();
  document.getElementById('inp').focus();
}

function switchSession(id) {
  if (id === currentSessionId && currentView === 'chat') return;
  cancelSessionRename();
  decideStarterActive = false;
  resetDecideStarter();
  currentSessionId = id;
  if (currentView !== 'chat') {
    showChatView();
  } else {
    renderMessages();
    renderSidebar();
  }
  if (window.innerWidth < 900) {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebarOverlay').classList.remove('visible');
  }
  document.getElementById('inp').focus();
}

function deleteSession(id) {
  if (sessionRenamingId === id) cancelSessionRename();
  const idx = sessions.findIndex(s => s.id === id);
  if (idx === -1) return;
  sessions.splice(idx, 1);
  saveSessions();
  if (id === currentSessionId) {
    if (sessions.length > 0) {
      currentSessionId = sessions[sessions.length - 1].id;
      renderMessages();
    } else {
      createNewSession();
      return;
    }
  }
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  if (!list) return;
  list.innerHTML = '';
  [...sessions].reverse().forEach(session => {
    const item = document.createElement('div');
    item.className = 'session-item' + (session.id === currentSessionId ? ' active' : '');
    const isEditing = sessionRenamingId === session.id;
    if (isEditing) item.classList.add('editing');

    if (isEditing) {
      const input = document.createElement('input');
      input.className = 'session-rename-input';
      input.value = sessionRenameDraft || session.title || '';
      input.maxLength = 40;

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'session-rename-cancel';
      cancelBtn.textContent = '✕';
      cancelBtn.title = '取消';
      cancelBtn.addEventListener('click', e => { e.stopPropagation(); cancelSessionRename(); renderSidebar(); });

      const saveBtn = document.createElement('button');
      saveBtn.className = 'session-rename-save';
      saveBtn.textContent = '✓';
      saveBtn.title = '保存';
      saveBtn.addEventListener('click', e => { e.stopPropagation(); saveSessionRename(session.id); });

      input.addEventListener('input', () => { sessionRenameDraft = input.value; });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); saveSessionRename(session.id); }
        if (e.key === 'Escape') { e.preventDefault(); cancelSessionRename(); renderSidebar(); }
      });
      input.addEventListener('click', e => e.stopPropagation());

      item.appendChild(input);
      item.appendChild(cancelBtn);
      item.appendChild(saveBtn);
      setTimeout(() => { input.focus(); input.select(); }, 0);
    } else {
      const titleEl = document.createElement('span');
      titleEl.className = 'session-title';
      titleEl.textContent = session.title;

      const editBtn = document.createElement('button');
      editBtn.className = 'session-edit';
      editBtn.textContent = '✎';
      editBtn.title = '重命名对话';
      editBtn.addEventListener('click', e => {
        e.stopPropagation();
        sessionRenamingId = session.id;
        sessionRenameDraft = session.title || '';
        renderSidebar();
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'session-del';
      delBtn.textContent = '×';
      delBtn.title = '删除此对话';
      delBtn.addEventListener('click', e => { e.stopPropagation(); deleteSession(session.id); });

      item.appendChild(titleEl);
      item.appendChild(editBtn);
      item.appendChild(delBtn);
      item.addEventListener('click', () => switchSession(session.id));
    }
    list.appendChild(item);
  });
  const favEntry = document.getElementById('favEntry');
  if (favEntry) favEntry.classList.toggle('active', currentView === 'favorites');
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (window.innerWidth < 900) {
    sidebar.classList.toggle('mobile-open');
    overlay.classList.toggle('visible');
  } else {
    sidebar.classList.toggle('collapsed');
    applySidebarWidth();
  }
}

/* ── RENDERING ── */
function renderMessages() {
  const c = document.getElementById('chatWrap');
  c.innerHTML = '';
  const session = getCurrentSession();
  const shouldShowDecideStarter = currentMode === 'decide' && decideStarterActive;
  if (!session || session.messages.length === 0 || shouldShowDecideStarter) {
    if (currentMode === 'decide') ensureWheelOptions();
    const welcome = document.createElement('div');
    welcome.className = 'welcome';
    const recommendActive = currentMode === 'recommend' ? ' active' : '';
    const decideActive = currentMode === 'decide' ? ' active' : '';
    const modeSub = currentMode === 'decide'
      ? '先决定今天吃什么方向，再进入找店。'
      : '告诉我城市、预算或场景，我来帮你筛出更合适的餐厅。';
    const chips = (currentMode === 'decide' ? DECIDE_CHIPS : RECOMMEND_WELCOME_CHIPS)
      .map(label => `<span class="chip" ${currentMode === 'decide' ? `data-decide="${esc(label)}"` : `data-suggest="${esc(label)}"`}>${esc(label)}</span>`)
      .join('');
    const wheelSegments = currentMode === 'decide'
      ? decideWheelOptions.map((item, i) => {
          const angle = (360 / decideWheelOptions.length) * i;
          const active = !decideWheelSpinning && i === decideWheelHighlight ? ' active' : '';
          return `<div class="decide-wheel-seg${active}" style="--a:${angle}deg;"><span>${esc(item.direction)}</span></div>`;
        }).join('')
      : '';
    const decideWheelHtml = currentMode === 'decide' ? `
      <div class="decide-wheel-card">
        <div class="decide-wheel-head">命运签 · 今天吃什么</div>
        <div class="decide-wheel-sub">点“开始抽签”会转一轮，再揭晓一个方向。</div>
        <div class="decide-wheel-wrap">
          <div class="decide-wheel-pointer"></div>
          <div class="decide-wheel${decideWheelSpinning ? ' spinning' : ''}" style="transform: rotate(${decideWheelRotation}deg);">
            ${wheelSegments}
          </div>
          <div class="decide-wheel-center">食</div>
        </div>
        <div class="decide-wheel-controls">
          <button class="decide-cta-btn" data-decide-action="spin" ${decideWheelSpinning ? 'disabled' : ''}>${decideWheelSpinning ? '抽签中…' : '开始抽签'}</button>
          <button class="decide-ghost-btn" data-decide-action="refresh-wheel" ${decideWheelSpinning ? 'disabled' : ''}>换一盘选项</button>
        </div>
      </div>
    ` : '';
    const decideResultHtml = currentMode === 'decide' && decideResult ? `
      <div class="decide-result-card">
        <div class="decide-result-eyebrow">今天适合吃</div>
        <div class="decide-result-title">${esc(decideResult.text)}</div>
        <div class="decide-result-direction">方向：${esc(decideResult.direction)}</div>
        <div class="decide-result-sub">${esc(decideResult.note)}</div>
        <div class="decide-result-actions">
          <button class="decide-cta-btn" data-decide-action="find">按这个找店</button>
          <button class="decide-ghost-btn" data-decide-action="reroll">再试一次</button>
        </div>
      </div>
    ` : '';
    welcome.innerHTML = `
      <div class="welcome-eyebrow">美食探店助手</div>
      <h2>你好，欢迎来觅食。</h2>
      <div class="home-entry-grid">
        <div class="home-entry-card${recommendActive}" data-mode-card="recommend">
          <div class="home-entry-title">推荐餐厅</div>
          <div class="home-entry-sub">输入偏好，给你一份当下更好选的餐厅方向。</div>
        </div>
        <div class="home-entry-card${decideActive}" data-mode-card="decide">
          <div class="home-entry-title">今天吃什么</div>
          <div class="home-entry-sub">不想想太多，选个状态让我帮你决定。</div>
        </div>
      </div>
      <p class="welcome-mode-sub">${modeSub}</p>
      ${decideWheelHtml}
      ${decideResultHtml}
      <div class="chips">${chips}</div>
    `;
    welcome.querySelectorAll('[data-mode-card]').forEach(card => {
      card.addEventListener('click', () => setAppMode(card.dataset.modeCard));
    });
    welcome.querySelectorAll('.chip').forEach(chip => {
      if (chip.dataset.decide) {
        chip.addEventListener('click', () => {
          if (chip.dataset.decide === '完全随机') {
            runDecideWheel(welcome);
          } else {
            chooseDecideChip(chip.dataset.decide);
          }
        });
      } else {
        chip.addEventListener('click', () => suggest(chip.dataset.suggest));
      }
    });
    welcome.querySelectorAll('[data-decide-action]').forEach(btn => {
      if (btn.dataset.decideAction === 'spin') {
        btn.addEventListener('click', () => runDecideWheel(welcome));
      }
      if (btn.dataset.decideAction === 'refresh-wheel') {
        btn.addEventListener('click', () => {
          decideWheelOptions = createWheelOptions();
          decideWheelHighlight = -1;
          decideWheelRotation = 0;
          renderMessages();
        });
      }
      if (btn.dataset.decideAction === 'find') {
        btn.addEventListener('click', () => {
          if (!decideResult) return;
          if (btn.dataset.locked === '1') return;
          btn.dataset.locked = '1';
          btn.disabled = true;
          const nextPrompt = buildFindByCuisinePrompt(decideResult);
          decideStarterActive = false;
          decideResult = null;
          setAppMode('recommend');
          suggest(nextPrompt);
        });
      }
      if (btn.dataset.decideAction === 'reroll') {
        btn.addEventListener('click', () => {
          if (decideResult && decideResult.source && decideResult.source !== '完全随机') {
            chooseDecideChip(decideResult.source);
          } else {
            runDecideWheel(welcome);
          }
        });
      }
    });
    c.appendChild(welcome);
    return;
  }
  session.messages.forEach(msg => {
    if (msg.role === 'user') appendUserBubble(msg.text);
    else appendBotBubbles(msg.text);
  });
  scroll();
}
