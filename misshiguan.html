<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>觅食官 · 美食探店助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  :root {
    --logo-size:              31px;
    --restaurant-name-size:   17px;
    --body-size:              14px;
    --label-size:             13px;
    --title-weight:           600;
    --body-weight:            400;
    --card-padding:           22px;
    --card-gap:               13px;
    --page-margin:            24px;
    --element-gap:            8px;
    --card-radius:            12px;
    --btn-radius:             9px;
    --input-radius:           7px;
    --color-bg:               #F7F3EE;
    --color-card:             #FDFAF6;
    --color-text-main:        #1A1209;
    --color-text-secondary:   #7A6858;
    --color-accent:           #C4622D;
    --color-border:           #E5DDD4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--color-bg);
    height: 100vh;
    overflow: hidden;
    color: var(--color-text-main);
    -webkit-font-smoothing: antialiased;
  }

  /* ── APP SHELL ── */
  .app-shell {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #EDE6DC;
    border-right: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.25s ease, opacity 0.2s ease;
  }

  .sidebar.collapsed {
    width: 0;
    opacity: 0;
    pointer-events: none;
  }

  .sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 14px 16px;
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }

  .sidebar-logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--color-text-main);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .new-chat-btn {
    width: 28px;
    height: 28px;
    background: none;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    color: var(--color-text-secondary);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    flex-shrink: 0;
    line-height: 1;
    padding-bottom: 1px;
  }

  .new-chat-btn:hover {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }

  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 6px;
  }

  .sidebar-list::-webkit-scrollbar { width: 3px; }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

  .session-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }

  .session-item:hover { background: rgba(0,0,0,0.05); }

  .session-item.active {
    background: var(--color-card);
    border-color: var(--color-border);
  }

  .session-title {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--color-text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 400;
    min-width: 0;
  }

  .session-del {
    opacity: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: 16px;
    padding: 0 3px;
    line-height: 1;
    border-radius: 3px;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
  }

  .session-item:hover .session-del { opacity: 1; }
  .session-del:hover { color: var(--color-accent); }

  /* ── SIDEBAR OVERLAY (mobile) ── */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 49;
  }

  .sidebar-overlay.visible { display: block; }

  /* ── MAIN AREA ── */
  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* ── HEADER ── */
  header {
    background: var(--color-card);
    border-bottom: 1px solid var(--color-border);
    padding: 16px var(--page-margin);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .hamburger-btn {
    width: 32px;
    height: 32px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 4px;
    border-radius: 6px;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .hamburger-btn:hover { background: var(--color-bg); }

  .hamburger-btn span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--color-text-secondary);
    border-radius: 1px;
  }

  .logo-name {
    font-family: 'Playfair Display', serif;
    font-size: var(--logo-size);
    font-weight: var(--title-weight);
    color: var(--color-text-main);
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .logo-sep {
    width: 1px;
    height: 20px;
    background: var(--color-border);
    flex-shrink: 0;
  }

  .logo-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    font-weight: var(--body-weight);
    letter-spacing: 0.01em;
  }

  .logo-dot {
    margin-left: auto;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--color-accent);
    flex-shrink: 0;
    opacity: 0.7;
  }

  /* ── CHAT AREA ── */
  .chat-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 36px var(--page-margin) 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 980px;
    width: 100%;
    margin: 0 auto;
  }

  .chat-wrap::-webkit-scrollbar { width: 4px; }
  .chat-wrap::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

  /* ── WELCOME ── */
  .welcome {
    padding: 8px 0 4px;
    animation: fadeUp 0.4s ease;
  }

  .welcome-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-accent);
    margin-bottom: 14px;
    opacity: 0.8;
  }

  .welcome h2 {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 500;
    color: var(--color-text-main);
    line-height: 1.2;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }

  .welcome p {
    font-size: var(--body-size);
    color: var(--color-text-secondary);
    line-height: 1.8;
    font-weight: var(--body-weight);
    max-width: 400px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 22px;
  }

  .chip {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    border: 1px solid var(--color-border);
    background: var(--color-card);
    padding: 6px 16px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    font-weight: var(--body-weight);
    line-height: 1.4;
  }

  .chip:hover {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }

  /* ── MESSAGE ROWS ── */
  .msg-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    animation: fadeUp 0.25s ease;
  }

  .msg-row.user { flex-direction: row-reverse; }

  .av {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--color-border);
    background: var(--color-card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-secondary);
    flex-shrink: 0;
    letter-spacing: -0.01em;
    margin-top: 2px;
  }

  .user-av {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }

  .user-bubble {
    max-width: 58%;
    background: var(--color-accent);
    color: white;
    border-radius: var(--btn-radius);
    padding: 10px 16px;
    font-size: var(--body-size);
    line-height: 1.65;
    font-weight: var(--body-weight);
    font-family: 'DM Sans', sans-serif;
  }

  .plain-bubble {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--btn-radius);
    padding: 10px 16px;
    font-size: var(--body-size);
    line-height: 1.8;
    color: var(--color-text-secondary);
    font-weight: var(--body-weight);
    font-family: 'DM Sans', sans-serif;
  }

  .bot-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }

  /* ── TYPING INDICATOR ── */
  .typing-dots {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 3px 0;
  }

  .typing-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--color-accent);
    opacity: 0.25;
    animation: dotPulse 1.4s ease-in-out infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 60%, 100% { opacity: 0.25; transform: scale(1); }
    30%           { opacity: 0.9;  transform: scale(1.25); }
  }

  /* ── CARDS GRID ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--card-gap);
  }

  /* ── RESTAURANT CARD ── */
  .r-card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--card-radius);
    padding: var(--card-padding);
    animation: fadeUp 0.3s ease both;
    transition: border-color 0.2s;
  }

  .r-card:hover { border-color: #CCADA0; }

  .card-index {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--color-border);
    letter-spacing: 0.06em;
    margin-bottom: var(--element-gap);
  }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: var(--restaurant-name-size);
    font-weight: var(--title-weight);
    color: var(--color-text-main);
    line-height: 1.3;
    margin-bottom: var(--element-gap);
    letter-spacing: -0.005em;
  }

  .card-rating {
    display: flex;
    align-items: baseline;
    gap: 5px;
    margin-bottom: var(--element-gap);
  }

  .card-stars {
    color: var(--color-accent);
    font-size: 11px;
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .card-score {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    font-weight: var(--body-weight);
  }

  .card-meta {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    margin-bottom: calc(var(--element-gap) * 0.6);
    line-height: 1.5;
    font-weight: var(--body-weight);
  }

  .meta-icon {
    flex-shrink: 0;
    font-size: 11px;
    opacity: 0.5;
    margin-top: 1px;
  }

  .card-divider {
    border: none;
    border-top: 1px solid var(--color-border);
    margin: calc(var(--element-gap) * 1.2) 0;
    opacity: 0.7;
  }

  .card-quote {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: var(--body-size);
    color: var(--color-text-secondary);
    line-height: 1.7;
    border-left: 2px solid var(--color-accent);
    padding-left: 12px;
    margin-bottom: var(--element-gap);
    font-weight: 400;
  }

  .card-link {
    display: inline-block;
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--color-border);
    transition: color 0.15s, text-decoration-color 0.15s;
    font-weight: var(--body-weight);
    cursor: pointer;
  }

  .card-link:hover {
    color: var(--color-accent);
    text-decoration-color: var(--color-accent);
  }

  /* ── ERROR BUBBLE ── */
  .error-bubble {
    background: #FDF3EE;
    border: 1px solid #F0C4A8;
    border-radius: var(--btn-radius);
    padding: 14px 16px;
    max-width: 380px;
  }

  .error-title {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--body-size);
    font-weight: 500;
    color: var(--color-text-main);
    margin-bottom: 5px;
  }

  .error-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .error-retry {
    background: var(--color-accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 7px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .error-retry:hover { opacity: 0.82; }

  /* ── INPUT BAR ── */
  .input-bar {
    background: var(--color-card);
    border-top: 1px solid var(--color-border);
    padding: 14px var(--page-margin) 20px;
    flex-shrink: 0;
  }

  .input-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    border: 1px solid var(--color-border);
    border-radius: var(--input-radius);
    padding: 11px 15px;
    font-family: 'DM Sans', sans-serif;
    font-size: var(--body-size);
    color: var(--color-text-main);
    background: var(--color-bg);
    resize: none;
    outline: none;
    line-height: 1.55;
    min-height: 44px;
    max-height: 130px;
    transition: border-color 0.15s;
    font-weight: var(--body-weight);
    -webkit-font-smoothing: antialiased;
  }

  textarea:focus { border-color: var(--color-accent); }

  textarea::placeholder {
    color: var(--color-text-secondary);
    opacity: 0.55;
  }

  .send-btn {
    width: 44px;
    height: 44px;
    background: var(--color-accent);
    border: none;
    border-radius: var(--btn-radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }

  .send-btn:hover  { opacity: 0.82; }
  .send-btn:active { opacity: 0.68; }
  .send-btn:disabled { opacity: 0.22; cursor: not-allowed; }

  .send-btn svg {
    width: 17px; height: 17px;
    fill: none; stroke: white;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }

  .foot-note {
    text-align: center;
    font-size: 11px;
    color: var(--color-text-secondary);
    opacity: 0.45;
    margin-top: 9px;
    font-weight: var(--body-weight);
    letter-spacing: 0.03em;
  }

  /* ── ANIMATION ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: translateY(0);   }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      z-index: 50;
      transform: translateX(-100%);
      width: 240px !important;
      opacity: 1 !important;
      pointer-events: none;
      transition: transform 0.25s ease;
    }

    .sidebar.mobile-open {
      transform: translateX(0);
      pointer-events: auto;
    }
  }

  @media (max-width: 720px) {
    .cards-grid { grid-template-columns: 1fr 1fr; }
    .chat-wrap  { padding: 24px 16px 20px; }
    .input-bar  { padding: 12px 16px 18px; }
  }

  @media (max-width: 480px) {
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-logo">觅食官</span>
      <button class="new-chat-btn" id="newChatBtn" title="新建对话">＋</button>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <div class="main-area">

    <header>
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="切换侧边栏">
        <span></span><span></span><span></span>
      </button>
      <div class="logo-name">觅食官</div>
      <div class="logo-sep"></div>
      <div class="logo-sub">Find good food, anywhere</div>
      <div class="logo-dot"></div>
    </header>

    <div class="chat-wrap" id="chatWrap"></div>

    <div class="input-bar">
      <div class="input-inner">
        <textarea id="inp" placeholder="例如：帮我找广州珠江新城适合约会的粤菜…" rows="1"></textarea>
        <button class="send-btn" id="btn">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <p class="foot-note">数据来源 Google Places · 实时搜索 · 仅供参考</p>
    </div>

  </div>
</div>

<script>
const WEBHOOK_URL = 'https://rayrayonthemove.app.n8n.cloud/webhook/86b2b344-ceaa-4601-92b8-2dc810150356/chat';
const STORAGE_KEY = 'misshiguan_sessions_v2';

let sessions = [];
let currentSessionId = null;
let busy = false;

/* ── UTILS ── */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function scroll() {
  const c = document.getElementById('chatWrap');
  setTimeout(() => c.scrollTop = c.scrollHeight, 60);
}

function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 130) + 'px';
}

function isRateLimitError(text) {
  const lower = text.toLowerCase();
  return lower.includes('error in workflow') || lower.includes('rate limit') || lower.includes('too many requests');
}

/* ── SESSION MANAGEMENT ── */
function loadSessions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    sessions = Array.isArray(parsed) ? parsed : [];
  } catch {
    sessions = [];
  }
}

function saveSessions() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); } catch {}
}

function getCurrentSession() {
  return sessions.find(s => s.id === currentSessionId) || null;
}

function createNewSession() {
  const session = {
    id: 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
    title: '新对话',
    messages: [],
    sid: 'sid_' + Math.random().toString(36).substr(2, 9)
  };
  sessions.push(session);
  saveSessions();
  currentSessionId = session.id;
  renderMessages();
  renderSidebar();
  document.getElementById('inp').focus();
}

function switchSession(id) {
  if (id === currentSessionId) return;
  currentSessionId = id;
  renderMessages();
  renderSidebar();
  if (window.innerWidth < 900) {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebarOverlay').classList.remove('visible');
  }
  document.getElementById('inp').focus();
}

function deleteSession(id) {
  const idx = sessions.findIndex(s => s.id === id);
  if (idx === -1) return;
  sessions.splice(idx, 1);
  saveSessions();
  if (id === currentSessionId) {
    if (sessions.length > 0) {
      currentSessionId = sessions[sessions.length - 1].id;
      renderMessages();
    } else {
      createNewSession();
      return;
    }
  }
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  if (!list) return;
  list.innerHTML = '';
  [...sessions].reverse().forEach(session => {
    const item = document.createElement('div');
    item.className = 'session-item' + (session.id === currentSessionId ? ' active' : '');

    const titleEl = document.createElement('span');
    titleEl.className = 'session-title';
    titleEl.textContent = session.title;

    const delBtn = document.createElement('button');
    delBtn.className = 'session-del';
    delBtn.textContent = '×';
    delBtn.title = '删除此对话';
    delBtn.addEventListener('click', e => { e.stopPropagation(); deleteSession(session.id); });

    item.appendChild(titleEl);
    item.appendChild(delBtn);
    item.addEventListener('click', () => switchSession(session.id));
    list.appendChild(item);
  });
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (window.innerWidth < 900) {
    sidebar.classList.toggle('mobile-open');
    overlay.classList.toggle('visible');
  } else {
    sidebar.classList.toggle('collapsed');
  }
}

/* ── RENDERING ── */
function renderMessages() {
  const c = document.getElementById('chatWrap');
  c.innerHTML = '';
  const session = getCurrentSession();
  if (!session || session.messages.length === 0) {
    const welcome = document.createElement('div');
    welcome.className = 'welcome';
    welcome.innerHTML = `
      <div class="welcome-eyebrow">美食探店助手</div>
      <h2>你好，欢迎来觅食。</h2>
      <p>告诉我你在哪个城市、想吃什么，<br>我帮你从 Google 实时找 Top 6 好店。</p>
      <div class="chips">
        <span class="chip" data-suggest="上海外滩高档餐厅">上海外滩高档餐厅</span>
        <span class="chip" data-suggest="北京三里屯咖啡厅">北京三里屯咖啡厅</span>
        <span class="chip" data-suggest="成都平价川菜">成都平价川菜</span>
        <span class="chip" data-suggest="Berlin brunch spots">Berlin brunch</span>
      </div>
    `;
    welcome.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => suggest(chip.dataset.suggest));
    });
    c.appendChild(welcome);
    return;
  }
  session.messages.forEach(msg => {
    if (msg.role === 'user') appendUserBubble(msg.text);
    else appendBotBubbles(msg.text);
  });
  scroll();
}

function appendUserBubble(text) {
  const c = document.getElementById('chatWrap');
  const d = document.createElement('div');
  d.className = 'msg-row user';
  d.innerHTML = `<div class="av user-av">你</div><div class="user-bubble">${esc(text)}</div>`;
  c.appendChild(d);
}

function appendBotBubbles(text) {
  const c = document.getElementById('chatWrap');
  const { restaurants, others } = parseRestaurants(text);

  const row = document.createElement('div');
  row.className = 'msg-row';
  row.style.alignItems = 'flex-start';

  const av = document.createElement('div');
  av.className = 'av'; av.textContent = '觅';

  const wrap = document.createElement('div');
  wrap.className = 'bot-wrap';

  others.forEach(t => {
    t = t.trim(); if (!t) return;
    const p = document.createElement('div');
    p.className = 'plain-bubble';
    p.innerHTML = t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    wrap.appendChild(p);
  });

  if (restaurants.length > 0) {
    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    restaurants.forEach((r, i) => {
      const card = document.createElement('div');
      card.className = 'r-card';
      card.style.animationDelay = (i * 0.07) + 's';
      card.innerHTML = `
        <div class="card-index">${String(i + 1).padStart(2, '0')}</div>
        <div class="card-name">${esc(r.name)}</div>
        ${r.rating ? `<div class="card-rating"><span class="card-stars">${starStr(r.rating)}</span><span class="card-score">&thinsp;${esc(r.rating)} 分</span></div>` : ''}
        ${r.address ? `<div class="card-meta"><span class="meta-icon">📍</span><span>${esc(r.address)}</span></div>` : ''}
        ${r.hours   ? `<div class="card-meta"><span class="meta-icon">🕐</span><span>${esc(r.hours)}</span></div>` : ''}
        ${r.quote   ? `<hr class="card-divider"><div class="card-quote">${esc(r.quote)}</div>` : ''}
        ${r.mapUrl  ? `<a class="card-link" href="${r.mapUrl}" target="_blank">查看地图 →</a>` : ''}
      `;
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  } else {
    const p = document.createElement('div');
    p.className = 'plain-bubble';
    p.innerHTML = text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    wrap.appendChild(p);
  }

  row.appendChild(av);
  row.appendChild(wrap);
  c.appendChild(row);
}

function appendErrorBubble(errorType, lastUserText) {
  const c = document.getElementById('chatWrap');
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.style.alignItems = 'flex-start';

  const av = document.createElement('div');
  av.className = 'av'; av.textContent = '觅';

  const wrap = document.createElement('div');
  wrap.className = 'bot-wrap';

  const bubble = document.createElement('div');
  bubble.className = 'error-bubble';

  const isNetwork = errorType === 'network';
  const titleEl = document.createElement('div');
  titleEl.className = 'error-title';
  titleEl.textContent = isNetwork ? '网络好像出了点问题' : '请求太快啦，稍等几秒～';

  const subEl = document.createElement('div');
  subEl.className = 'error-sub';
  subEl.textContent = isNetwork
    ? '请检查网络连接后重试'
    : '每次对话会消耗较多资源，请等几秒后重试';

  const retryBtn = document.createElement('button');
  retryBtn.className = 'error-retry';
  retryBtn.textContent = '重新发送';
  retryBtn.addEventListener('click', () => resendRequest(lastUserText));

  bubble.appendChild(titleEl);
  bubble.appendChild(subEl);
  bubble.appendChild(retryBtn);
  wrap.appendChild(bubble);
  row.appendChild(av);
  row.appendChild(wrap);
  c.appendChild(row);
}

function showTyping() {
  const c = document.getElementById('chatWrap');
  const d = document.createElement('div');
  d.className = 'msg-row'; d.id = 'typ';
  d.innerHTML = `<div class="av">觅</div><div class="bot-wrap"><div class="plain-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;
  c.appendChild(d); scroll();
}

function hideTyping() {
  const e = document.getElementById('typ'); if (e) e.remove();
}

/* ── RESTAURANT PARSING ── */
function parseRestaurants(text) {
  const blocks = text.split(/(?=🍽️)/);
  const restaurants = [], others = [];
  blocks.forEach(b => {
    b = b.trim(); if (!b) return;
    if (b.startsWith('🍽️')) {
      const nm = b.match(/🍽️\s*\*?\*?([^\n*]+)\*?\*?/);
      const rt = b.match(/⭐\s*([\d.]+)/);
      const ad = b.match(/📍\s*([^\n]+)/);
      const hr = b.match(/🕐\s*([^\n]+)/);
      const qt = b.match(/💬\s*([^\n]+)/);
      const lk = b.match(/\[([^\]]*(?:Google Maps|查看)[^\]]*)\]\((https?:\/\/[^\)]+)\)/i);
      if (nm) restaurants.push({
        name: nm[1].trim(),
        rating: rt ? rt[1] : null,
        address: ad ? ad[1].trim() : null,
        hours: hr ? hr[1].trim() : null,
        quote: qt ? qt[1].trim() : null,
        mapUrl: lk ? lk[2] : null,
      });
    } else {
      others.push(b);
    }
  });
  return { restaurants, others };
}

function starStr(r) {
  if (!r) return '';
  const n = parseFloat(r), f = Math.floor(n);
  return '★'.repeat(f) + (n%1>=0.5?'½':'') + '☆'.repeat(5-f-(n%1>=0.5?1:0));
}

/* ── NETWORK ── */
async function callAPI(text, sessionSid) {
  const res = await fetch(WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'sendMessage', sessionId: sessionSid, chatInput: text })
  });
  const data = await res.json();
  return data.output || data.text || data.message || '暂时没找到结果，换个关键词试试？';
}

/* ── SEND ── */
function suggest(t) {
  document.getElementById('inp').value = t;
  send();
}

async function send() {
  const btn = document.getElementById('btn');
  if (busy || btn.disabled) return;
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = 'auto';

  busy = true;
  btn.disabled = true;

  const session = getCurrentSession();
  const sessionId = session.id;

  if (session.messages.length === 0) {
    session.title = text.slice(0, 20) || '新对话';
    saveSessions();
    renderSidebar();
  }

  session.messages.push({ role: 'user', text });
  saveSessions();
  appendUserBubble(text);
  showTyping();

  let output = null, errorType = null;
  try {
    output = await callAPI(text, session.sid);
    if (isRateLimitError(output)) { errorType = 'rateLimit'; output = null; }
  } catch {
    errorType = 'network';
  }

  hideTyping();

  if (output !== null) {
    session.messages.push({ role: 'bot', text: output });
    saveSessions();
    if (currentSessionId === sessionId) appendBotBubbles(output);
  } else {
    if (currentSessionId === sessionId) appendErrorBubble(errorType, text);
  }

  busy = false;
  setTimeout(() => { btn.disabled = false; }, 2500);
  scroll();
}

async function resendRequest(lastUserText) {
  const btn = document.getElementById('btn');
  if (busy || btn.disabled) return;
  busy = true;
  btn.disabled = true;

  const c = document.getElementById('chatWrap');
  const rows = c.querySelectorAll('.msg-row');
  for (let i = rows.length - 1; i >= 0; i--) {
    if (rows[i].querySelector('.error-bubble')) { rows[i].remove(); break; }
  }

  showTyping();

  const session = getCurrentSession();
  const sessionId = session.id;

  let output = null, errorType = null;
  try {
    output = await callAPI(lastUserText, session.sid);
    if (isRateLimitError(output)) { errorType = 'rateLimit'; output = null; }
  } catch {
    errorType = 'network';
  }

  hideTyping();

  if (output !== null) {
    session.messages.push({ role: 'bot', text: output });
    saveSessions();
    if (currentSessionId === sessionId) appendBotBubbles(output);
  } else {
    if (currentSessionId === sessionId) appendErrorBubble(errorType, lastUserText);
  }

  busy = false;
  setTimeout(() => { btn.disabled = false; document.getElementById('inp').focus(); }, 2500);
  scroll();
}

/* ── INIT ── */
function init() {
  loadSessions();
  if (sessions.length === 0) {
    createNewSession();
  } else {
    currentSessionId = sessions[sessions.length - 1].id;
    renderMessages();
    renderSidebar();
  }

  document.getElementById('inp').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  document.getElementById('inp').addEventListener('input', function() { resize(this); });
  document.getElementById('btn').addEventListener('click', send);
  document.getElementById('newChatBtn').addEventListener('click', createNewSession);
  document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
  document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);
}

document.addEventListener('DOMContentLoaded', init);
</script>
