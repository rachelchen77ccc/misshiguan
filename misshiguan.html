              : '<div class="decide-custom-empty">暂时还没加私藏选项，先用上面的筛选也可以。</div>'}
          </div>
        </div>
      </div>
    ` : '';
    const decideGeoLabel = geoStatus === 'ready' && geoData ? guessGeoLabel(geoData) : '';
    const hasDecideGeo = !!decideGeoLabel;
    const decideFindLabel = hasDecideGeo && decideResult ? `按当前位置找${decideResult.direction}` : (decideResult ? `📍 使用当前位置找${decideResult.direction}` : '📍 使用当前位置找这类餐厅');
    const decideManualLabel = hasDecideGeo ? '改用其他城市' : (decideResult ? '输入其他城市' : '输入城市');
    const decideFlowHint = hasDecideGeo
      ? `已获取默认位置：${decideGeoLabel}，你也可以随时改用其他城市。`
      : (geoStatus === 'requesting'
          ? '正在获取位置授权，通过后可直接按当前位置找店。'
          : '还没有位置信息。可先用当前位置找店，或手动输入其他城市。');
    const decideResultHtml = currentMode === 'decide' && decideResult ? `
      <div class="decide-result-card">
        <div class="decide-result-eyebrow">命运签结果</div>
        <div class="decide-result-title">${esc(decideResult.text)}</div>
        <div class="decide-result-direction">方向：${esc(decideResult.direction)}</div>
        <div class="decide-result-sub">${esc(decideResult.note)} ${esc(decideFlowHint)}</div>
        <div class="decide-result-actions">
          <button class="decide-cta-btn" data-decide-action="find">${esc(decideFindLabel)}</button>
          <button class="decide-ghost-btn" data-decide-action="manual-city">${esc(decideManualLabel)}</button>
          <button class="decide-ghost-btn" data-decide-action="reroll">再试一次</button>
        </div>
      </div>
    ` : '';
    welcome.innerHTML = `
      <div class="welcome-eyebrow">美食探店助手</div>
      <h2>你好，欢迎来觅食。</h2>
      <div class="home-entry-grid">
        <div class="home-entry-card${recommendActive}" data-mode-card="recommend">
          <div class="home-entry-title">推荐餐厅</div>
          <div class="home-entry-sub">输入偏好，给你一份当下更好选的餐厅方向。</div>
        </div>
        <div class="home-entry-card${decideActive}" data-mode-card="decide">
          <div class="home-entry-title">今天吃什么</div>
          <div class="home-entry-sub">不想想太多，选个状态让我帮你决定。</div>
        </div>
      </div>
      <p class="welcome-mode-sub">${modeSub}</p>
      ${decideWheelHtml}
      ${decideResultHtml}
      ${chips ? `<div class="chips">${chips}</div>` : ''}
    `;
    welcome.querySelectorAll('[data-mode-card]').forEach(card => {
      card.addEventListener('click', () => setAppMode(card.dataset.modeCard));
    });
    welcome.querySelectorAll('.chip').forEach(chip => {
      if (chip.dataset.suggest) {
        chip.addEventListener('click', () => suggest(chip.dataset.suggest));
      }
    });
    welcome.querySelectorAll('[data-geo-action="locate"]').forEach(btn => {
      btn.addEventListener('click', requestGeolocation);
    });
    welcome.querySelectorAll('[data-decide-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (decideWheelSpinning) return;
        setDecideSelection(btn.dataset.decideFilter, btn.dataset.decideValue);
      });
    });
    const decideCustomInput = welcome.querySelector('#decideCustomInput');
    const submitCustomOption = () => {
      if (!decideCustomInput) return;
      const added = addCustomDecideOption(decideCustomInput.value);
      if (added) {
        decideCustomInput.value = '';
        if (currentView === 'chat' && decideStarterActive) renderMessages();
      }
    };
    if (decideCustomInput) {
      decideCustomInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitCustomOption();
        }
      });
    }
    welcome.querySelectorAll('[data-decide-remove-custom]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (decideWheelSpinning) return;
        removeCustomDecideOption(btn.dataset.decideRemoveCustom);
        if (currentView === 'chat' && decideStarterActive) renderMessages();
      });
    });
    welcome.querySelectorAll('[data-decide-action]').forEach(btn => {
      if (btn.dataset.decideAction === 'spin') {
        btn.addEventListener('click', () => runDecideWheel(welcome));
      }
      if (btn.dataset.decideAction === 'add-custom') {
        btn.addEventListener('click', submitCustomOption);
      }
      if (btn.dataset.decideAction === 'refresh-wheel') {
        btn.addEventListener('click', () => {
          updateDecideWheelFromCurrentState();
          renderMessages();
        });
      }
      if (btn.dataset.decideAction === 'find') {
        btn.addEventListener('click', () => {
          if (!decideResult) return;
          if (geoStatus === 'ready' && geoData) {
            if (btn.dataset.locked === '1') return;
            btn.dataset.locked = '1';
            btn.disabled = true;
            const userPrompt = buildFindByCuisineUserPrompt(decideResult);
            const nextTask = { type: 'strictLocalCuisine', direction: decideResult.direction, geoSnapshot: cloneGeoSnapshot() };
            decideStarterActive = false;
            decideResult = null;
            setAppMode('recommend');
            suggest(userPrompt, nextTask);
            return;
          }
          if (geoStatus === 'requesting') return;
          if (btn.dataset.locked === '1') return;
          btn.dataset.locked = '1';
          btn.disabled = true;
          requestGeolocation({
            onSuccess: () => {
              if (!decideResult) return;
              const userPrompt = buildFindByCuisineUserPrompt(decideResult);
              const nextTask = { type: 'strictLocalCuisine', direction: decideResult.direction, geoSnapshot: cloneGeoSnapshot() };
              decideStarterActive = false;
              decideResult = null;
              setAppMode('recommend');
              suggest(userPrompt, nextTask);
            },
            onError: () => {
              btn.dataset.locked = '0';
              btn.disabled = false;
            }
          });
        });
      }
      if (btn.dataset.decideAction === 'manual-city') {
        btn.addEventListener('click', () => {
          if (!decideResult) return;
          decideStarterActive = false;
          setAppMode('recommend');
          prefillManualCityPromptByDecide(decideResult);
        });
      }
      if (btn.dataset.decideAction === 'reroll') {
        btn.addEventListener('click', () => runDecideWheel(welcome));
      }
    });
    c.appendChild(welcome);
    return;
  }
  session.messages.forEach(msg => {
    if (msg.role === 'user') appendUserBubble(msg.text);
    else appendBotBubbles(msg.text);
  });
  scroll();
}

/* ── RESTAURANT PARSING ── */
function parseRestaurants(text) {
  const blocks = text.split(/(?=🍽️)/);
  const restaurants = [], others = [];
  blocks.forEach(b => {
    b = b.trim(); if (!b) return;
    if (b.startsWith('🍽️')) {
      const nm = b.match(/🍽️\s*\*?\*?([^\n*]+)\*?\*?/);
      const rt = b.match(/⭐\s*([\d.]+)(?:\s*[（(]([^)）]+)[)）])?/);
      const ad = b.match(/📍\s*([^\n]+)/);
      const hr = b.match(/🕐\s*([^\n]+)/);
      const qt = b.match(/💬\s*([^\n]+)/);
      const lk = b.match(/\[([^\]]*(?:Google Maps|查看)[^\]]*)\]\((https?:\/\/[^\)]+)\)/i);
      const suitableReason = matchRestaurantField(b, ['适合你']);
      const warmRecommendation = matchRestaurantField(b, ['一句有温度的推荐语', '推荐语']);
      const reviewSignal = matchRestaurantField(b, ['小提醒']);
      if (nm) restaurants.push({
        name: nm[1].trim(),
        rating: rt ? rt[1] : null,
        ratingCount: rt && rt[2] ? rt[2].trim() : null,
        address: ad ? ad[1].trim() : null,
        hours: hr ? hr[1].trim() : null,
        quote: qt ? qt[1].trim() : null,
        suitableReason,
        warmRecommendation,
        reviewSignal,
        mapUrl: lk ? lk[2] : null,
      });
    } else {
      others.push(b);
    }
  });
  return { restaurants, others };
}

function starStr(r) {
  if (!r) return '';
  const n = parseFloat(r), f = Math.floor(n);
  return '★'.repeat(f) + (n%1>=0.5?'½':'') + '☆'.repeat(5-f-(n%1>=0.5?1:0));
}

function matchRestaurantField(block, labels) {
  for (const label of labels) {
    const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const match = block.match(new RegExp(`(?:^|\\n)${escaped}\\s*[：:]\\s*([^\\n]+)`));
    if (match && match[1]) return match[1].trim();
  }
  return null;
}

function renderRestaurantRating(restaurant) {
  if (!restaurant || !restaurant.rating) return '';
  return `
    <div class="card-rating">
      <span class="card-stars">${starStr(restaurant.rating)}</span>
      <span class="card-score">&thinsp;${esc(restaurant.rating)} 分</span>
      ${restaurant.ratingCount ? `<span class="card-rating-count">(${esc(restaurant.ratingCount)})</span>` : ''}
    </div>
  `;
}

function renderRestaurantReasoning(restaurant) {
  if (!restaurant) return '';
  const warmText = restaurant.warmRecommendation || restaurant.quote;
  const parts = [];
  if (restaurant.suitableReason) {
    parts.push(`
      <div class="card-suitable">
        <div class="card-suitable-label">适合你</div>
        <div class="card-suitable-text">${esc(restaurant.suitableReason)}</div>
      </div>
    `);
  }
  if (warmText) {
    parts.push(`<div class="card-story">${esc(warmText)}</div>`);
  } else if (restaurant.quote) {
    parts.push(`<div class="card-quote">${esc(restaurant.quote)}</div>`);
  }
  if (restaurant.reviewSignal) {
    parts.push(`<div class="card-note"><span class="card-note-label">小提醒</span>${esc(restaurant.reviewSignal)}</div>`);
  }
  return parts.length ? `<div class="card-reasoning">${parts.join('')}</div>` : '';
}

/* ── FAV POPOVER ── */
function openFavPopover(restaurant) {
  _favPopoverRestaurant = restaurant;
  document.getElementById('favPanelSub').textContent = restaurant.name || '';
  renderFavPopover();
  document.getElementById('favOverlay').classList.add('open');
  document.getElementById('favNewInput').value = '';
}

function closeFavPopover() {
  document.getElementById('favOverlay').classList.remove('open');
  _favPopoverRestaurant = null;
  refreshAllCardFavStates();
}

function renderFavPopover() {
  const r = _favPopoverRestaurant; if (!r) return;
  const f = loadFavs();
  const checked = getRestaurantCollections(r.name, r.address);
  const allColls = Object.keys(f);
  const listEl = document.getElementById('favCollsList');
  listEl.innerHTML = '';
  if (allColls.length === 0) {
    const hint = document.createElement('div');
    hint.className = 'fav-empty-hint';
    hint.textContent = '还没有合集，请先新建一个';
    listEl.appendChild(hint);
    return;
  }
  allColls.forEach(coll => {
    const isChecked = checked.includes(coll);
    const item = document.createElement('div');
    item.className = 'fav-coll-item' + (isChecked ? ' checked' : '');
    item.innerHTML = `
      <div class="fav-coll-check">${isChecked ? '✓' : ''}</div>
      <span class="fav-coll-label">${esc(coll)}</span>
      <span class="fav-coll-count-badge">${f[coll].length}</span>
    `;
    item.addEventListener('click', () => {
      const nowChecked = item.classList.contains('checked');
      setRestaurantInCollection(r, coll, !nowChecked);
      renderFavPopover();
      if (!nowChecked) showFavHint(`已收藏到「${coll}」`);
    });
    listEl.appendChild(item);
  });
}

function initFavPopover() {
  document.getElementById('favOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('favOverlay')) closeFavPopover();
  });
  document.getElementById('favNewBtn').addEventListener('click', doAddNewCollection);
  document.getElementById('favNewInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doAddNewCollection();
  });
  document.getElementById('favPanelClose').addEventListener('click', closeFavPopover);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('favOverlay').classList.contains('open')) closeFavPopover();
  });
  document.getElementById('favEntry').addEventListener('click', () => {
    if (currentView === 'favorites') showChatView(); else showFavView();
  });
}

function doAddNewCollection() {
  const inp = document.getElementById('favNewInput');
  const name = inp.value.trim();
  if (!name || !_favPopoverRestaurant) return;
  const added = addToNewCollection(name, _favPopoverRestaurant);
  inp.value = '';
  renderFavPopover();
  if (added) showFavHint(`已收藏到「${name}」`);
  else showFavHint(`「${name}」里已存在这家店`);
}

function refreshAllCardFavStates() {
  document.querySelectorAll('.fav-btn').forEach(btn => {
    const saved = isFavorited(btn.dataset.name, btn.dataset.address);
    btn.classList.toggle('saved', saved);
    btn.textContent = saved ? '♥' : '♡';
    btn.title = saved ? '已收藏' : '收藏';
  });
}

function showFavHint(msg) {
  let hint = document.getElementById('favHint');
  if (!hint) {
    hint = document.createElement('div');
    hint.id = 'favHint';
    hint.className = 'fav-hint';
    document.body.appendChild(hint);
  }
  hint.textContent = msg;
  hint.classList.add('show');
  clearTimeout(hint._timer);
  hint._timer = setTimeout(() => { hint.classList.remove('show'); }, 1800);
}

function cancelCollectionRename() {
  favRenamingCollection = null;
  favRenameDraft = '';
  renderFavView();
}

function submitCollectionRename(collName) {
  const oldName = collName;
  const newName = favRenameDraft.trim();
  if (!newName) {
    showFavHint('合集名不能为空');
    return;
  }
  if (newName === oldName) {
    cancelCollectionRename();
    return;
  }
  const f = loadFavs();
  if (Object.prototype.hasOwnProperty.call(f, newName)) {
    showFavHint('已有同名合集');
    return;
  }
  f[newName] = f[oldName] || [];
  delete f[oldName];
  saveFavs(f);
  if (favExpandedCollection === oldName) favExpandedCollection = newName;
  if (favPendingDeleteCollection === oldName) favPendingDeleteCollection = null;
  favRenamingCollection = null;
  favRenameDraft = '';
  renderFavView();
  showFavHint(`合集已改名为「${newName}」`);
}

  if (favPendingDeleteCollection && !colls.includes(favPendingDeleteCollection)) favPendingDeleteCollection = null;

    favRenamingCollection = null;
    favRenameDraft = '';

  el.innerHTML = `<div class="fav-view-title">我的收藏</div><div class="fav-view-sub">你收藏的好店，按合集整理</div>`;

    const empty = document.createElement('div');
    empty.className = 'fav-empty-state';
    empty.innerHTML = `<div class="fav-empty-icon">🍽️</div><div class="fav-empty-title">还没有收藏的餐厅</div><div class="fav-empty-sub">在聊天中搜索餐厅，<br>点击卡片右上角的 ♡ 按钮保存</div>`;
    el.appendChild(empty);
    return;
  }
  colls.forEach(collName => {
    const list = f[collName];
    const section = document.createElement('div');
    section.className = 'fav-coll-section';
    const isExpanded = favExpandedCollection === collName;
    const isPendingDelete = favPendingDeleteCollection === collName;
    const isRenaming = favRenamingCollection === collName;
    if (isExpanded) section.classList.add('expanded');

    const header = document.createElement('div');
    header.className = 'fav-coll-header';
    header.innerHTML = `
      <div class="fav-coll-name">${esc(collName)}</div>
      <span class="fav-coll-badge">${list.length} 家</span>
      <button class="fav-coll-edit-btn" title="重命名合集">✎</button>
      <button class="fav-coll-del-btn" title="删除整个合集">×</button>
      <span class="fav-coll-toggle">▾</span>
    `;
    header.addEventListener('click', () => {
      favExpandedCollection = favExpandedCollection === collName ? null : collName;
      favPendingDeleteCollection = null;
      favRenamingCollection = null;
      favRenameDraft = '';
      renderFavView();
    });
    header.querySelector('.fav-coll-edit-btn').addEventListener('click', e => {
      e.stopPropagation();
      favRenamingCollection = collName;
      favRenameDraft = collName;
      favPendingDeleteCollection = null;
      renderFavView();
    });
    header.querySelector('.fav-coll-del-btn').addEventListener('click', e => {
      e.stopPropagation();
      favPendingDeleteCollection = collName;
      favRenamingCollection = null;
      favRenameDraft = '';
      renderFavView();
    });
    section.appendChild(header);

    if (isRenaming) {
      const renameRow = document.createElement('div');
      renameRow.className = 'fav-coll-rename-row';
      renameRow.innerHTML = `
        <input class="fav-coll-rename-input" maxlength="30" />
        <button class="fav-coll-rename-cancel">取消</button>
        <button class="fav-coll-rename-save">保存</button>
      `;
      const renameInput = renameRow.querySelector('.fav-coll-rename-input');
      renameInput.value = favRenameDraft || collName;
      renameInput.addEventListener('input', () => { favRenameDraft = renameInput.value; });
      renameInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') submitCollectionRename(collName);
        if (e.key === 'Escape') cancelCollectionRename();
      });
      renameRow.querySelector('.fav-coll-rename-cancel').addEventListener('click', e => {
        e.stopPropagation();
        cancelCollectionRename();
      });
      renameRow.querySelector('.fav-coll-rename-save').addEventListener('click', e => {
        e.stopPropagation();
        submitCollectionRename(collName);
      });
      section.appendChild(renameRow);
      setTimeout(() => {
        renameInput.focus();
        renameInput.select();
      }, 0);
    }

    if (isExpanded) {
      const restList = document.createElement('div');
      list.forEach(r => {
        const row = document.createElement('div');
        row.className = 'fav-rest-row';
        row.innerHTML = `
          <div class="fav-rest-info">
            <div class="fav-rest-name">${esc(r.name)}</div>
            <div class="fav-rest-meta">${r.rating ? '⭐ ' + esc(r.rating) + ' 分' : ''}${r.rating && r.address ? '  ·  ' : ''}${r.address ? '📍 ' + esc(r.address) : ''}</div>
            ${r.mapUrl ? `<a class="fav-rest-link" href="${r.mapUrl}" target="_blank">查看地图 →</a>` : ''}
          </div>
          <button class="fav-rest-del" title="从此合集移除">×</button>
        `;
        row.querySelector('.fav-rest-del').addEventListener('click', () => {
          setRestaurantInCollection(r, collName, false);
          renderFavView(); refreshAllCardFavStates();
        });
        restList.appendChild(row);
      });
      section.appendChild(restList);
    }

    if (isPendingDelete) {
      const confirm = document.createElement('div');
      confirm.className = 'fav-coll-delete-confirm';
      confirm.innerHTML = `
        <div class="fav-coll-delete-text">确认删除合集「${esc(collName)}」吗？</div>
        <div class="fav-coll-delete-actions">
          <button class="fav-coll-cancel-btn">取消</button>
          <button class="fav-coll-confirm-btn">确认删除</button>
        </div>
      `;
      confirm.querySelector('.fav-coll-cancel-btn').addEventListener('click', e => {
        e.stopPropagation();
        favPendingDeleteCollection = null;
        renderFavView();
      });
      confirm.querySelector('.fav-coll-confirm-btn').addEventListener('click', e => {
        e.stopPropagation();
        const f2 = loadFavs();
        delete f2[collName];
        saveFavs(f2);
        if (favExpandedCollection === collName) favExpandedCollection = null;
        favPendingDeleteCollection = null;
        renderFavView();
        refreshAllCardFavStates();
      });
      section.appendChild(confirm);
    }
    el.appendChild(section);
  });
}

/* ── FOLLOW-UP CHIPS ── */
async function generateFollowUpChips(userQuestion, sessionSid, sessionId) {
  const prompt = `根据用户问题「${userQuestion}」和当前给出的餐厅推荐结果，\n生成 3 个适合继续追问的简短问题，要求：\n1. 每个问题不超过 12 个字\n2. 要自然，像用户下一步真的会点的追问\n3. 尽量从这些方向里挑选：更便宜、适合约会、适合自习、vegan、离市中心近、营业更晚、人均更低、氛围更安静、适合一个人吃、当地特色\n4. 不要重复用户原问题\n5. 只返回 JSON 数组，格式必须是：\n["问题1","问题2","问题3"]\n不要返回 markdown，不要返回解释，不要返回代码块`;
  let chips;
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'sendMessage', sessionId: sessionSid, chatInput: prompt })
    });
    const data = await res.json();
    const raw = data.output || data.text || data.message || '';
    const match = raw.match(/\[[\s\S]*?\]/);
    if (!match) return;
    chips = JSON.parse(match[0]);
    if (!Array.isArray(chips) || chips.length === 0) return;
    chips = chips.slice(0, 3).filter(c => typeof c === 'string' && c.trim());
    if (chips.length === 0) return;
  } catch {
    return;
  }
  if (currentSessionId !== sessionId) return;
  const chatWrap = document.getElementById('chatWrap');
  const botWraps = chatWrap.querySelectorAll('.bot-wrap');
  if (botWraps.length === 0) return;
  const container = document.createElement('div');
  container.className = 'follow-up-chips';
  chips.forEach(label => {
    const chip = document.createElement('span');
    chip.className = 'follow-up-chip';
    chip.textContent = label;
    chip.addEventListener('click', () => {
      container.remove();
      suggest(label);
    });
    container.appendChild(chip);
  });
  botWraps[botWraps.length - 1].appendChild(container);
  scroll();
}

/* ── NETWORK ── */
async function callAPI(text, sessionSid) {
  const res = await fetch(WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'sendMessage', sessionId: sessionSid, chatInput: text })
  });
  const data = await res.json();
  return data.output || data.text || data.message || '暂时没找到结果，换个关键词试试？';
}

/* ── SEND ── */
function suggest(t, apiOverride) {
  pendingApiPromptOverride = typeof apiOverride === 'string' ? apiOverride : null;
  pendingApiTask = (apiOverride && typeof apiOverride === 'object') ? apiOverride : null;
  document.getElementById('inp').value = t;
  send();
}

async function send() {
  const btn = document.getElementById('btn');
  if (busy || btn.disabled) return;
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  decideStarterActive = false;
  clearDecideWheelTimer();
  decideWheelSpinning = false;
  inp.value = ''; inp.style.height = 'auto';

  busy = true;
  btn.disabled = true;

  const session = getCurrentSession();
  const sessionId = session.id;

  if (session.messages.length === 0) {
    session.title = text.slice(0, 20) || '新对话';
    saveSessions();
    renderSidebar();
  }

  session.messages.push({ role: 'user', text });
  saveSessions();
  appendUserBubble(text);
  document.querySelectorAll('.follow-up-chips').forEach(el => el.remove());
  showTyping();

  let output = null, errorType = null;
  let apiTask = pendingApiTask;
  const apiInput = ((pendingApiPromptOverride && pendingApiPromptOverride.trim()) || buildRecommendInputWithGeo(text)).trim();
  pendingApiPromptOverride = null;
  pendingApiTask = null;
  try {
    if (apiTask && apiTask.type === 'strictLocalCuisine') {
      output = await runStrictLocalCuisineSearch(apiTask, session.sid);
    } else if (currentMode === 'recommend' && geoStatus === 'ready' && geoData && !textLooksLikeHasLocation(text)) {
      const autoCuisine = extractCuisineFromText(text);
      if (autoCuisine) {
        apiTask = { type: 'strictLocalCuisine', direction: autoCuisine, geoSnapshot: cloneGeoSnapshot() };
        output = await runStrictLocalCuisineSearch(apiTask, session.sid);
      } else {
        output = await callAPI(apiInput, session.sid);
      }
    } else {
      output = await callAPI(apiInput, session.sid);
    }
    if (isRateLimitError(output)) { errorType = 'rateLimit'; output = null; }
  } catch {
    errorType = 'network';
  }

  hideTyping();

  if (output !== null) {
    session.messages.push({ role: 'bot', text: output });
    saveSessions();
    if (currentSessionId === sessionId) {
      appendBotBubbles(output);
      if (parseRestaurants(output).restaurants.length > 0) {
        generateFollowUpChips(text, session.sid, sessionId);
      }
    }
  } else {
    if (currentSessionId === sessionId) appendErrorBubble(errorType, text, apiInput, apiTask);
  }

  busy = false;
  setTimeout(() => { btn.disabled = false; }, 2500);
  scroll();
}

async function resendRequest(lastUserText, lastApiText, lastApiTask) {
  const btn = document.getElementById('btn');
  if (busy || btn.disabled) return;
  busy = true;
  btn.disabled = true;

  const c = document.getElementById('chatWrap');
  const rows = c.querySelectorAll('.msg-row');
  for (let i = rows.length - 1; i >= 0; i--) {
    if (rows[i].querySelector('.error-bubble')) { rows[i].remove(); break; }
  }
  document.querySelectorAll('.follow-up-chips').forEach(el => el.remove());
  showTyping();

  const session = getCurrentSession();
  const sessionId = session.id;

  let output = null, errorType = null;
  const apiInput = ((lastApiText && String(lastApiText).trim()) || buildRecommendInputWithGeo(lastUserText)).trim();
  try {
    if (lastApiTask && lastApiTask.type === 'strictLocalCuisine') {
      output = await runStrictLocalCuisineSearch(lastApiTask, session.sid);
    } else {
      output = await callAPI(apiInput, session.sid);
    }
    if (isRateLimitError(output)) { errorType = 'rateLimit'; output = null; }
  } catch {
    errorType = 'network';
  }

  hideTyping();

  if (output !== null) {
    session.messages.push({ role: 'bot', text: output });
    saveSessions();
    if (currentSessionId === sessionId) {
      appendBotBubbles(output);
      if (parseRestaurants(output).restaurants.length > 0) {
        generateFollowUpChips(lastUserText, session.sid, sessionId);
      }
    }
  } else {
    if (currentSessionId === sessionId) appendErrorBubble(errorType, lastUserText, apiInput, lastApiTask);
  }

  busy = false;
  setTimeout(() => { btn.disabled = false; document.getElementById('inp').focus(); }, 2500);
  scroll();
}

/* ── INIT ── */
function init() {
  loadSidebarWidth();
  applySidebarWidth();
  initSidebarResize();
  loadSessions();
  if (sessions.length === 0) {
    createNewSession();
  } else {
    currentSessionId = sessions[sessions.length - 1].id;
    renderMessages();
    renderSidebar();
  }

  document.getElementById('inp').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  document.getElementById('inp').addEventListener('input', function() { resize(this); });
  document.getElementById('modeSwitch').querySelectorAll('.mode-switch-btn').forEach(btn => {
    btn.addEventListener('click', () => setAppMode(btn.dataset.mode));
  });
  syncModeUI();
  document.getElementById('btn').addEventListener('click', send);
  document.getElementById('newChatBtn').addEventListener('click', createNewSession);
  document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
  document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);
  initFavPopover();
  initSharePanel();
}

/* ── SHARE FUNCTIONALITY ── */
let _sharePendingRestaurants = null;

function openSharePanel(restaurants) {
  _sharePendingRestaurants = restaurants.map(r => ({ ...r, selected: true }));
  renderShareRestList();
  document.getElementById('shareConfirmBtn').disabled = false;
  document.getElementById('shareConfirmBtn').textContent = '生成图片';
  document.getElementById('shareOverlay').classList.add('open');
}

function closeSharePanel() {
  document.getElementById('shareOverlay').classList.remove('open');
  _sharePendingRestaurants = null;
}

function renderShareRestList() {
  const list = document.getElementById('shareRestList');
  list.innerHTML = '';
  if (!_sharePendingRestaurants) return;
  _sharePendingRestaurants.forEach((r, i) => {
    const item = document.createElement('div');
    item.className = 'share-rest-item' + (r.selected ? ' checked' : '');
    const metaParts = [];
    if (r.rating) metaParts.push('⭐ ' + esc(r.rating));
    if (r.address) metaParts.push(esc(r.address));
    item.innerHTML = `
      <div class="share-rest-check">${r.selected ? '✓' : ''}</div>
      <div class="share-rest-label">
        <div class="share-rest-name">${esc(r.name)}</div>
        ${metaParts.length ? `<div class="share-rest-meta">${metaParts.join(' · ')}</div>` : ''}
      </div>
    `;
    item.addEventListener('click', () => {
      _sharePendingRestaurants[i].selected = !_sharePendingRestaurants[i].selected;
      renderShareRestList();
      const anySelected = _sharePendingRestaurants.some(x => x.selected);
      document.getElementById('shareConfirmBtn').disabled = !anySelected;
    });
    list.appendChild(item);
  });
  const anySelected = _sharePendingRestaurants.some(x => x.selected);
  document.getElementById('shareConfirmBtn').disabled = !anySelected;
}

function initSharePanel() {
  document.getElementById('shareOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('shareOverlay')) closeSharePanel();
  });
  document.getElementById('shareCancelBtn').addEventListener('click', closeSharePanel);
  document.getElementById('shareConfirmBtn').addEventListener('click', doGenerateShareImage);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('shareOverlay').classList.contains('open')) closeSharePanel();
  });
}

async function doGenerateShareImage() {
  if (!_sharePendingRestaurants) return;
  const selected = _sharePendingRestaurants.filter(r => r.selected);
  if (selected.length === 0) return;
  const btn = document.getElementById('shareConfirmBtn');
  btn.disabled = true;
  btn.textContent = '生成中…';
  try {
    await generateShareImage(selected);
    closeSharePanel();
  } catch {
    btn.disabled = false;
    btn.textContent = '生成图片';
    showShareToast('生成失败，请重试');
  }
}

async function generateShareImage(restaurants) {
  if (typeof html2canvas !== 'function') {
    showShareToast('分享功能加载中，请稍后重试');
    throw new Error('html2canvas not loaded');
  }

  const d = new Date();
  const dateStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const filename = `觅食官_${dateStr}.png`;

  const restCardsHtml = restaurants.map((r, i) => `
    <div style="background:#FDFAF6;border:1px solid #E5DDD4;border-radius:12px;padding:18px 20px;margin-bottom:10px;">
      <div style="font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;color:#CCBFB3;letter-spacing:0.06em;margin-bottom:7px;">${String(i+1).padStart(2,'0')}</div>
      <div style="font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:#1A1209;line-height:1.3;margin-bottom:7px;letter-spacing:-0.005em;">${esc(r.name)}</div>
      ${r.rating ? `<div style="font-family:'DM Sans',sans-serif;font-size:12px;color:#C4622D;margin-bottom:5px;"><span>${starStr(r.rating)}</span> <span style="color:#7A6858;">${esc(r.rating)} 分</span>${r.ratingCount ? ` <span style="color:#7A6858;opacity:0.72;">(${esc(r.ratingCount)})</span>` : ''}</div>` : ''}
      ${r.address ? `<div style="font-family:'DM Sans',sans-serif;font-size:12px;color:#7A6858;margin-bottom:4px;">📍 ${esc(r.address)}</div>` : ''}
      ${r.hours ? `<div style="font-family:'DM Sans',sans-serif;font-size:12px;color:#7A6858;margin-bottom:4px;">🕐 ${esc(r.hours)}</div>` : ''}
      ${r.suitableReason ? `<div style="margin-top:10px;border:1px solid #E9D5C6;background:linear-gradient(180deg,#FFF7F0 0%,#FDF5EE 100%);border-radius:12px;padding:9px 10px;"><div style="font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:#C4622D;margin-bottom:5px;">适合你</div><div style="font-family:'DM Sans',sans-serif;font-size:12px;line-height:1.6;color:#1A1209;">${esc(r.suitableReason)}</div></div>` : ''}
      ${(r.warmRecommendation || r.quote) ? `<div style="font-family:'Playfair Display',serif;font-size:13px;color:#7A6858;line-height:1.7;border-left:2px solid #C4622D;padding-left:11px;margin-top:10px;">“${esc(r.warmRecommendation || r.quote)}”</div>` : ''}
      ${r.reviewSignal ? `<div style="font-family:'DM Sans',sans-serif;font-size:11px;color:#7A6858;line-height:1.6;background:rgba(229,221,212,0.3);border-radius:10px;padding:8px 10px;margin-top:9px;"><span style="color:#1A1209;opacity:0.72;margin-right:4px;">小提醒</span>${esc(r.reviewSignal)}</div>` : ''}
    </div>
  `).join('');

  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:480px;background:#F7F3EE;font-family:\'DM Sans\',sans-serif;-webkit-font-smoothing:antialiased;box-sizing:border-box;';
  container.innerHTML = `
    <div style="padding:36px 32px 28px;">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px;">
        <span style="font-family:'Playfair Display',serif;font-size:26px;font-weight:600;color:#1A1209;letter-spacing:-0.01em;line-height:1;">觅食官</span>
        <span style="font-family:'DM Sans',sans-serif;font-size:13px;color:#7A6858;font-weight:400;">· Find Good Food</span>
      </div>
      <div style="width:28px;height:2px;background:#C4622D;border-radius:1px;margin-bottom:16px;"></div>
      <div style="font-family:'DM Sans',sans-serif;font-size:12px;color:#7A6858;margin-bottom:24px;letter-spacing:0.02em;opacity:0.8;">今天这份推荐，想先存下来</div>
      ${restCardsHtml}
      <div style="margin-top:20px;padding-top:14px;border-top:1px solid #E5DDD4;font-family:'DM Sans',sans-serif;font-size:10px;color:#7A6858;opacity:0.4;letter-spacing:0.06em;text-align:center;">rachelchen77ccc.github.io/misshiguan</div>
    </div>
  `;
  document.body.appendChild(container);

  try {
    const canvas = await html2canvas(container, {
      backgroundColor: '#F7F3EE',
      scale: 2,
      useCORS: true,
      logging: false,
      width: 480,
      height: container.scrollHeight,
      windowWidth: 480,
      windowHeight: container.scrollHeight,
    });
    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.download = filename;
    a.href = dataUrl;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isMobile) showShareToast('图片已生成，如未保存请长按图片');
  } finally {
    document.body.removeChild(container);
  }
}

function showShareToast(msg) {
  let t = document.getElementById('shareToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'shareToast';
    t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(26,18,9,0.82);color:white;font-family:\'DM Sans\',sans-serif;font-size:13px;padding:10px 22px;border-radius:100px;z-index:9999;white-space:nowrap;pointer-events:none;transition:opacity 0.3s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 3000);
}

document.addEventListener('DOMContentLoaded', init);
