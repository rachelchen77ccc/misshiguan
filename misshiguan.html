<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>觅食官 · 美食探店助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --logo-size:              31px;
    --restaurant-name-size:   17px;
    --body-size:              14px;
    --label-size:             13px;
    --title-weight:           600;
    --body-weight:            400;
    --card-padding:           22px;
    --card-gap:               13px;
    --page-margin:            24px;
    --element-gap:            8px;
    --card-radius:            12px;
    --btn-radius:             9px;
    --input-radius:           7px;
    --color-bg:               #F7F3EE;
    --color-card:             #FDFAF6;
    --color-text-main:        #1A1209;
    --color-text-secondary:   #7A6858;
    --color-accent:           #C4622D;
    --color-border:           #E5DDD4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--color-bg);
    height: 100vh;
    overflow: hidden;
    color: var(--color-text-main);
    -webkit-font-smoothing: antialiased;
  }
  body.resizing-sidebar {
    cursor: col-resize;
    user-select: none;
  }

  /* ── APP SHELL ── */
  .app-shell {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #EDE6DC;
    border-right: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.25s ease, opacity 0.2s ease;
  }

  .sidebar.collapsed {
    width: 0;
    opacity: 0;
    pointer-events: none;
  }
  .sidebar-resizer {
    width: 8px;
    flex-shrink: 0;
    cursor: col-resize;
    position: relative;
    background: transparent;
  }
  .sidebar-resizer::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 0;
    width: 1px;
    height: 100%;
    background: rgba(122, 104, 88, 0.14);
    transition: background 0.15s;
  }
  .sidebar-resizer:hover::after,
  body.resizing-sidebar .sidebar-resizer::after {
    background: rgba(196, 98, 45, 0.45);
  }
  .sidebar.collapsed + .sidebar-resizer {
    width: 0;
    pointer-events: none;
  }

  .sidebar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 14px 16px;
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }

  .sidebar-logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--color-text-main);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .new-chat-btn {
    width: 28px;
    height: 28px;
    background: none;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    color: var(--color-text-secondary);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    flex-shrink: 0;
    line-height: 1;
    padding-bottom: 1px;
  }

  .new-chat-btn:hover {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }

  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 6px;
  }

  .sidebar-list::-webkit-scrollbar { width: 3px; }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

  .session-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }

  .session-item:hover { background: rgba(0,0,0,0.05); }

  .session-item.active {
    background: var(--color-card);
    border-color: var(--color-border);
  }

  .session-title {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--color-text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 400;
    min-width: 0;
  }

  .session-del {
    opacity: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: 16px;
    padding: 0 3px;
    line-height: 1;
    border-radius: 3px;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
  }

  .session-item:hover .session-del { opacity: 1; }
  .session-del:hover { color: var(--color-accent); }
  .session-edit {
    opacity: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: 13px;
    padding: 0 3px;
    line-height: 1;
    border-radius: 3px;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .session-item:hover .session-edit { opacity: 1; }
  .session-edit:hover { color: var(--color-accent); }
  .session-item.editing {
    background: var(--color-card);
    border-color: var(--color-border);
    cursor: default;
  }
  .session-rename-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--color-border);
    background: var(--color-bg);
    border-radius: 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--color-text-main);
    padding: 5px 8px;
    outline: none;
  }
  .session-rename-input:focus { border-color: var(--color-accent); }
  .session-rename-save,
  .session-rename-cancel {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: 13px;
    padding: 0 3px;
    line-height: 1;
    border-radius: 3px;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .session-rename-save:hover,
  .session-rename-cancel:hover { color: var(--color-accent); }

  /* ── SIDEBAR OVERLAY (mobile) ── */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 49;
  }

  .sidebar-overlay.visible { display: block; }

  /* ── MAIN AREA ── */
  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  /* ── HEADER ── */
  header {
    background: var(--color-card);
    border-bottom: 1px solid var(--color-border);
    padding: 16px var(--page-margin);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .hamburger-btn {
    width: 32px;
    height: 32px;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 4px;
    border-radius: 6px;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .hamburger-btn:hover { background: var(--color-bg); }

  .hamburger-btn span {
    display: block;
    width: 18px;
    height: 2px;
    background: var(--color-text-secondary);
    border-radius: 1px;
  }

  .logo-name {
    font-family: 'Playfair Display', serif;
    font-size: var(--logo-size);
    font-weight: var(--title-weight);
    color: var(--color-text-main);
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .logo-sep {
    width: 1px;
    height: 20px;
    background: var(--color-border);
    flex-shrink: 0;
  }

  .logo-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    font-weight: var(--body-weight);
    letter-spacing: 0.01em;
  }

  .logo-dot {
    margin-left: auto;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--color-accent);
    flex-shrink: 0;
    opacity: 0.7;
  }

  /* ── CHAT AREA ── */
  .chat-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 36px var(--page-margin) 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 980px;
    width: 100%;
    margin: 0 auto;
  }

  .chat-wrap::-webkit-scrollbar { width: 4px; }
  .chat-wrap::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

  /* ── WELCOME ── */
  .welcome {
    padding: 8px 0 4px;
    animation: fadeUp 0.4s ease;
  }

  .welcome-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-accent);
    margin-bottom: 14px;
    opacity: 0.8;
  }

  .welcome h2 {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 500;
    color: var(--color-text-main);
    line-height: 1.2;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }

  .welcome p {
    font-size: var(--body-size);
    color: var(--color-text-secondary);
    line-height: 1.8;
    font-weight: var(--body-weight);
    max-width: 400px;
  }
  .welcome-mode-sub {
    margin-top: 8px;
    max-width: 520px;
  }
  .home-entry-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 18px 0 14px;
    max-width: 640px;
  }
  .home-entry-card {
    border: 1px solid var(--color-border);
    background: var(--color-card);
    border-radius: 14px;
    padding: 14px 14px 13px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  .home-entry-card:hover {
    border-color: #DFC8B7;
    background: #FBF7F2;
    transform: translateY(-1px);
  }
  .home-entry-card.active {
    border-color: #E3B89B;
    background: #FFF5EF;
  }
  .home-entry-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    color: var(--color-text-main);
    line-height: 1.2;
    margin-bottom: 5px;
    letter-spacing: -0.01em;
  }
  .home-entry-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.6;
  }
  .decide-result-card {
    margin-top: 14px;
    max-width: 520px;
    border: 1px solid #E7D8CC;
    background: #FFF7F1;
    border-radius: 14px;
    padding: 14px 15px 13px;
    animation: fadeUp 0.2s ease;
  }
  .decide-result-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .decide-result-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    line-height: 1.35;
    color: var(--color-text-main);
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .decide-result-direction {
    display: inline-block;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    line-height: 1;
    color: var(--color-accent);
    border: 1px solid #E7C5B0;
    background: #FFF3EA;
    border-radius: 999px;
    padding: 4px 9px;
    margin-bottom: 8px;
  }
  .decide-result-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.7;
    margin-bottom: 10px;
  }
  .decide-result-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .decide-cta-btn,
  .decide-ghost-btn {
    border-radius: 999px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1;
    padding: 8px 12px;
    cursor: pointer;
    transition: opacity 0.15s, background 0.15s, border-color 0.15s, color 0.15s;
  }
  .decide-cta-btn {
    border: 1px solid #E3B89B;
    background: #FFF1E8;
    color: var(--color-accent);
  }
  .decide-cta-btn:hover { opacity: 0.85; }
  .decide-cta-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .decide-ghost-btn {
    border: 1px solid var(--color-border);
    background: var(--color-card);
    color: var(--color-text-secondary);
  }
  .decide-ghost-btn:hover { background: var(--color-bg); }
  .decide-ghost-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .decide-wheel-card {
    margin-top: 12px;
    max-width: 560px;
    border: 1px solid var(--color-border);
    background: linear-gradient(165deg, #FCF8F2 0%, #F7F1E9 100%);
    border-radius: 16px;
    padding: 14px 14px 12px;
  }
  .decide-wheel-head {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    line-height: 1.25;
    color: var(--color-text-main);
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }
  .decide-wheel-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .decide-wheel-wrap {
    width: 260px;
    height: 260px;
    margin: 0 auto 10px;
    position: relative;
  }
  .decide-wheel-pointer {
    position: absolute;
    left: 50%;
    top: -6px;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 13px solid #C4622D;
    z-index: 3;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.12));
  }
  .decide-wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 1px solid #E5D5C9;
    position: relative;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0) 0 36%, rgba(255,255,255,0.65) 36% 38%, rgba(255,255,255,0) 38% 100%),
      conic-gradient(from -12deg, #F2DED0, #F9E8D9, #F3DBC7, #E9D4C7, #F4E3D3, #EED7C8, #F7E7D8, #EAD6C9, #F2DED0);
    box-shadow: inset 0 0 0 8px rgba(255,255,255,0.62), 0 6px 20px rgba(98,71,46,0.08);
  }
  .decide-wheel.spinning {
    box-shadow: inset 0 0 0 8px rgba(255,255,255,0.62), 0 10px 26px rgba(98,71,46,0.15);
  }
  .decide-wheel-seg {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 90px;
    margin-left: -45px;
    transform: rotate(var(--a)) translateY(-106px) rotate(calc(-1 * var(--a)));
    text-align: center;
  }
  .decide-wheel-seg span {
    display: inline-block;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    line-height: 1.2;
    color: #6C5B4B;
    background: rgba(255,255,255,0.72);
    border: 1px solid rgba(208,188,172,0.8);
    border-radius: 999px;
    padding: 4px 8px;
    max-width: 88px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .decide-wheel-seg.active span {
    border-color: #E3B89B;
    color: var(--color-accent);
    background: #FFF3EA;
  }
  .decide-wheel-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid #E2CEC0;
    background: #FFF9F2;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 23px;
    color: #9C7A63;
    letter-spacing: 0.02em;
  }
  .decide-wheel-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .decide-filter-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 14px;
    padding: 14px 14px 12px;
    border: 1px solid rgba(229, 213, 201, 0.9);
    border-radius: 14px;
    background: rgba(255, 252, 247, 0.78);
  }

  .decide-filter-group {
    min-width: 0;
  }

  .decide-filter-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    line-height: 1.2;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
    opacity: 0.72;
    margin-bottom: 8px;
  }

  .decide-filter-chips,
  .decide-custom-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .decide-filter-chip,
  .decide-custom-chip {
    border-radius: 999px;
    border: 1px solid var(--color-border);
    background: var(--color-card);
    color: var(--color-text-secondary);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1;
    padding: 8px 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.15s;
  }

  .decide-filter-chip:hover,
  .decide-custom-chip:hover {
    background: #FBF5EF;
    border-color: #DFC8B7;
    transform: translateY(-1px);
  }

  .decide-filter-chip.active {
    background: #FFF1E8;
    border-color: #E3B89B;
    color: var(--color-accent);
  }

  .decide-wheel-summary {
    margin-bottom: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1.65;
    color: var(--color-text-secondary);
  }

  .decide-wheel-summary strong {
    color: var(--color-text-main);
    font-weight: 500;
  }

  .decide-custom-panel {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(229, 213, 201, 0.8);
  }

  .decide-custom-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  .decide-custom-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    line-height: 1.25;
    color: var(--color-text-main);
    letter-spacing: -0.01em;
  }

  .decide-custom-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1.6;
    color: var(--color-text-secondary);
  }

  .decide-custom-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .decide-custom-input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--color-border);
    border-radius: 999px;
    background: rgba(255,255,255,0.72);
    color: var(--color-text-main);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    line-height: 1.2;
    padding: 10px 14px;
    outline: none;
  }

  .decide-custom-input:focus {
    border-color: #E3B89B;
    box-shadow: 0 0 0 3px rgba(227, 184, 155, 0.14);
  }

  .decide-custom-add {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .decide-custom-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding-right: 9px;
  }

  .decide-custom-remove {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    background: rgba(196, 98, 45, 0.1);
    color: var(--color-accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }

  .decide-custom-empty {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1.6;
    color: var(--color-text-secondary);
    opacity: 0.72;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 22px;
  }

  .chip {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    border: 1px solid var(--color-border);
    background: var(--color-card);
    padding: 6px 16px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    font-weight: var(--body-weight);
    line-height: 1.4;
  }

  .chip:hover {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }
  .chip-geo {
    border-color: #D8B8A5;
    color: #8D6247;
    background: #FFF7F2;
    font-size: calc(var(--label-size) + 1px);
    font-weight: 520;
    padding: 7px 18px;
    letter-spacing: 0.01em;
  }
  .chip-geo.is-loading {
    opacity: 0.7;
    cursor: wait;
  }
  .geo-hint {
    max-width: 980px;
    margin: 8px auto 0;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1.55;
    color: var(--color-text-secondary);
    opacity: 0.8;
    min-height: 20px;
  }

  /* ── MESSAGE ROWS ── */
  .msg-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    animation: fadeUp 0.25s ease;
  }

  .msg-row.user { flex-direction: row-reverse; }

  .av {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--color-border);
    background: var(--color-card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-secondary);
    flex-shrink: 0;
    letter-spacing: -0.01em;
    margin-top: 2px;
  }

  .user-av {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }

  .user-bubble {
    max-width: 58%;
    background: var(--color-accent);
    color: white;
    border-radius: var(--btn-radius);
    padding: 10px 16px;
    font-size: var(--body-size);
    line-height: 1.65;
    font-weight: var(--body-weight);
    font-family: 'DM Sans', sans-serif;
  }

  .plain-bubble {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--btn-radius);
    padding: 10px 16px;
    font-size: var(--body-size);
    line-height: 1.8;
    color: var(--color-text-secondary);
    font-weight: var(--body-weight);
    font-family: 'DM Sans', sans-serif;
  }

  .bot-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }

  /* ── TYPING INDICATOR ── */
  .typing-dots {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 3px 0;
  }

  .typing-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--color-accent);
    opacity: 0.25;
    animation: dotPulse 1.4s ease-in-out infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 60%, 100% { opacity: 0.25; transform: scale(1); }
    30%           { opacity: 0.9;  transform: scale(1.25); }
  }

  /* ── CARDS GRID ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--card-gap);
  }

  /* ── RESTAURANT CARD ── */
  .r-card {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--card-radius);
    padding: var(--card-padding);
    animation: fadeUp 0.3s ease both;
    transition: border-color 0.2s;
  }

  .r-card:hover { border-color: #CCADA0; }

  .card-index {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--color-border);
    letter-spacing: 0.06em;
    margin-bottom: var(--element-gap);
  }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: var(--restaurant-name-size);
    font-weight: var(--title-weight);
    color: var(--color-text-main);
    line-height: 1.3;
    margin-bottom: var(--element-gap);
    letter-spacing: -0.005em;
  }

  .card-rating {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: var(--element-gap);
  }

  .card-stars {
    color: var(--color-accent);
    font-size: 11px;
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .card-score {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    font-weight: var(--body-weight);
  }

  .card-rating-count {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: var(--color-text-secondary);
    opacity: 0.72;
    font-weight: var(--body-weight);
  }

  .card-meta {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    margin-bottom: calc(var(--element-gap) * 0.6);
    line-height: 1.5;
    font-weight: var(--body-weight);
  }

  .meta-icon {
    flex-shrink: 0;
    font-size: 11px;
    opacity: 0.5;
    margin-top: 1px;
  }

  .card-divider {
    border: none;
    border-top: 1px solid var(--color-border);
    margin: calc(var(--element-gap) * 1.2) 0;
    opacity: 0.7;
  }

  .card-quote {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: var(--body-size);
    color: var(--color-text-secondary);
    line-height: 1.7;
    border-left: 2px solid var(--color-accent);
    padding-left: 12px;
    margin-bottom: var(--element-gap);
    font-weight: 400;
  }

  .card-reasoning {
    margin: calc(var(--element-gap) * 1.1) 0 var(--element-gap);
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .card-suitable {
    border: 1px solid #E9D5C6;
    background: linear-gradient(180deg, #FFF7F0 0%, #FDF5EE 100%);
    border-radius: 14px;
    padding: 11px 12px 10px;
    min-width: 0;
  }

  .card-suitable-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-accent);
    margin-bottom: 7px;
    font-weight: 500;
  }

  .card-suitable-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    line-height: 1.65;
    color: var(--color-text-main);
    overflow-wrap: anywhere;
  }

  .card-story {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    line-height: 1.72;
    color: var(--color-text-main);
    padding-left: 12px;
    border-left: 2px solid #D8B39B;
    min-width: 0;
  }

  .card-story::before,
  .card-story::after {
    color: #C79A7D;
    opacity: 0.7;
  }

  .card-story::before { content: "“"; margin-right: 1px; }
  .card-story::after { content: "”"; margin-left: 1px; }

  .card-note {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1.65;
    color: var(--color-text-secondary);
    background: rgba(229, 221, 212, 0.3);
    border-radius: 12px;
    padding: 9px 11px;
    overflow-wrap: anywhere;
  }

  .card-note-label {
    color: var(--color-text-main);
    opacity: 0.72;
    margin-right: 4px;
  }

  .card-link {
    display: inline-block;
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--color-border);
    transition: color 0.15s, text-decoration-color 0.15s;
    font-weight: var(--body-weight);
    cursor: pointer;
  }

  .card-link:hover {
    color: var(--color-accent);
    text-decoration-color: var(--color-accent);
  }

  /* ── ERROR BUBBLE ── */
  .error-bubble {
    background: #FDF3EE;
    border: 1px solid #F0C4A8;
    border-radius: var(--btn-radius);
    padding: 14px 16px;
    max-width: 380px;
  }

  .error-title {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--body-size);
    font-weight: 500;
    color: var(--color-text-main);
    margin-bottom: 5px;
  }

  .error-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .error-retry {
    background: var(--color-accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 7px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .error-retry:hover { opacity: 0.82; }

  /* ── INPUT BAR ── */
  .input-bar {
    background: var(--color-card);
    border-top: 1px solid var(--color-border);
    padding: 14px var(--page-margin) 20px;
    flex-shrink: 0;
  }
  .mode-switch {
    max-width: 980px;
    margin: 0 auto 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--color-border);
    border-radius: 999px;
    background: var(--color-bg);
    padding: 4px;
  }
  .mode-switch-btn {
    border: none;
    background: transparent;
    color: var(--color-text-secondary);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1;
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, opacity 0.15s;
    opacity: 0.85;
    white-space: nowrap;
  }
  .mode-switch-btn.active {
    background: #FFF3EE;
    color: var(--color-accent);
    opacity: 1;
  }
  .mode-switch-btn:hover { opacity: 1; }

  .input-inner {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    border: 1px solid var(--color-border);
    border-radius: var(--input-radius);
    padding: 11px 15px;
    font-family: 'DM Sans', sans-serif;
    font-size: var(--body-size);
    color: var(--color-text-main);
    background: var(--color-bg);
    resize: none;
    outline: none;
    line-height: 1.55;
    min-height: 44px;
    max-height: 130px;
    transition: border-color 0.15s;
    font-weight: var(--body-weight);
    -webkit-font-smoothing: antialiased;
  }

  textarea:focus { border-color: var(--color-accent); }

  textarea::placeholder {
    color: var(--color-text-secondary);
    opacity: 0.55;
  }

  .send-btn {
    width: 44px;
    height: 44px;
    background: var(--color-accent);
    border: none;
    border-radius: var(--btn-radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }

  .send-btn:hover  { opacity: 0.82; }
  .send-btn:active { opacity: 0.68; }
  .send-btn:disabled { opacity: 0.22; cursor: not-allowed; }

  .send-btn svg {
    width: 17px; height: 17px;
    fill: none; stroke: white;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }

  .foot-note {
    text-align: center;
    font-size: 11px;
    color: var(--color-text-secondary);
    opacity: 0.45;
    margin-top: 9px;
    font-weight: var(--body-weight);
    letter-spacing: 0.03em;
  }

  /* ── ANIMATION ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: translateY(0);   }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      z-index: 50;
      transform: translateX(-100%);
      width: 240px !important;
      opacity: 1 !important;
      pointer-events: none;
      transition: transform 0.25s ease;
    }
    .sidebar-resizer { display: none; }

    .sidebar.mobile-open {
      transform: translateX(0);
      pointer-events: auto;
    }
  }

  @media (max-width: 720px) {
    .cards-grid { grid-template-columns: 1fr 1fr; }
    .chat-wrap  { padding: 24px 16px 20px; }
    .input-bar  { padding: 12px 16px 18px; }
    .home-entry-grid { grid-template-columns: 1fr; max-width: 460px; }
    .decide-wheel-wrap { width: 236px; height: 236px; }
    .decide-wheel-seg { transform: rotate(var(--a)) translateY(-96px) rotate(calc(-1 * var(--a))); }
    .decide-custom-head { flex-direction: column; align-items: flex-start; gap: 4px; }
  }

  @media (max-width: 480px) {
    .cards-grid { grid-template-columns: 1fr; }

    /* Mobile card fold: hide cards beyond #3 until user expands */
    .mobile-fold { display: none; }

    /* Sidebar: use small viewport height to avoid iOS URL-bar overlap */
    .sidebar { height: 100svh; }

    /* Input bar: add iPhone home indicator clearance */
    .input-bar {
      padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    }

    /* Header: reclaim horizontal space on small screens */
    header { padding: 11px 14px; }
    .logo-sub, .logo-sep { display: none; }

    /* Cards: tighter padding on mobile */
    .r-card { padding: 16px; }

    .card-story { font-size: 15px; }
    .card-suitable { padding: 10px 11px; }
    .decide-filter-panel { padding: 12px; }
    .decide-custom-input-row { flex-direction: column; }
    .decide-custom-add { width: 100%; justify-content: center; }

    /* Chat wrap: less top breathing room on small screens */
    .chat-wrap { padding-top: 20px; }
  }

  /* ── FOLLOW-UP CHIPS ── */
  .follow-up-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
    animation: fadeUp 0.3s ease;
  }

  .follow-up-chip {
    font-family: 'DM Sans', sans-serif;
    font-size: var(--label-size);
    color: var(--color-text-secondary);
    border: 1px solid var(--color-border);
    background: var(--color-card);
    padding: 6px 16px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    font-weight: var(--body-weight);
    line-height: 1.4;
    white-space: nowrap;
  }

  .follow-up-chip:hover {
    background: var(--color-accent);
    color: white;
    border-color: var(--color-accent);
  }

  /* ── CARD FAV BUTTON ── */
  .r-card { position: relative; }

  .fav-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 26px;
    height: 26px;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--color-text-secondary);
    opacity: 0;
    transition: opacity 0.15s, background 0.15s, border-color 0.15s, color 0.15s;
    line-height: 1;
    padding: 0;
  }
  .r-card:hover .fav-btn { opacity: 1; }
  .fav-btn.saved { opacity: 1; color: var(--color-accent); border-color: #F0C4A8; background: #FFF3EE; }
  .fav-btn:hover { background: var(--color-accent) !important; color: white !important; border-color: var(--color-accent) !important; opacity: 1; }

  /* ── FAV POPOVER OVERLAY ── */
  .fav-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,18,9,0.38);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .fav-overlay.open { display: flex; }

  .fav-panel {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: 14px;
    padding: 22px 20px 18px;
    width: 300px;
    max-width: calc(100vw - 40px);
    box-shadow: 0 8px 36px rgba(0,0,0,0.14);
    animation: fadeUp 0.2s ease;
    position: relative;
  }
  .fav-panel-close {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    border-radius: 6px;
    color: var(--color-text-secondary);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
  }
  .fav-panel-close:hover {
    opacity: 1;
    color: var(--color-accent);
    background: var(--color-bg);
  }

  .fav-panel-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--color-text-main);
    margin-bottom: 4px;
  }

  .fav-panel-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-bottom: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .fav-collections-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 190px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .fav-collections-list::-webkit-scrollbar { width: 3px; }
  .fav-collections-list::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

  .fav-coll-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
    user-select: none;
  }
  .fav-coll-item:hover { background: var(--color-bg); }

  .fav-coll-check {
    width: 17px;
    height: 17px;
    border: 1.5px solid var(--color-border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 10px;
    color: white;
    background: white;
    transition: background 0.15s, border-color 0.15s;
  }
  .fav-coll-item.checked .fav-coll-check {
    background: var(--color-accent);
    border-color: var(--color-accent);
  }

  .fav-coll-label { font-size: 14px; color: var(--color-text-main); flex: 1; }
  .fav-coll-count-badge { font-size: 11px; color: var(--color-text-secondary); opacity: 0.55; }

  .fav-new-row {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--color-border);
  }
  .fav-new-input {
    flex: 1;
    border: 1px solid var(--color-border);
    border-radius: var(--input-radius);
    padding: 8px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: var(--color-bg);
    color: var(--color-text-main);
    outline: none;
    transition: border-color 0.15s;
    min-width: 0;
  }
  .fav-new-input:focus { border-color: var(--color-accent); }
  .fav-new-input::placeholder { color: var(--color-text-secondary); opacity: 0.5; }

  .fav-new-btn {
    background: var(--color-accent);
    color: white;
    border: none;
    border-radius: var(--btn-radius);
    padding: 8px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .fav-new-btn:hover { opacity: 0.85; }

  .fav-empty-hint {
    font-size: 13px;
    color: var(--color-text-secondary);
    text-align: center;
    padding: 12px 0 8px;
    opacity: 0.6;
  }

  /* ── SIDEBAR FAVORITES ENTRY ── */
  .sidebar-fav-divider {
    height: 1px;
    background: var(--color-border);
    margin: 4px 10px;
    opacity: 0.7;
    flex-shrink: 0;
  }
  .sidebar-fav-entry {
    margin: 4px 6px 10px;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--color-text-secondary);
    border: 1px solid transparent;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    flex-shrink: 0;
    user-select: none;
  }
  .sidebar-fav-entry:hover { background: rgba(0,0,0,0.05); }
  .sidebar-fav-entry.active {
    background: var(--color-card);
    border-color: var(--color-border);
    color: var(--color-accent);
    font-weight: 500;
  }

  /* ── FAVORITES VIEW ── */
  .fav-view {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 36px var(--page-margin) 28px;
    max-width: 980px;
    width: 100%;
    margin: 0 auto;
  }
  .fav-view.active { display: block; }
  .fav-view::-webkit-scrollbar { width: 4px; }
  .fav-view::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

  .fav-view-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 500;
    color: var(--color-text-main);
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .fav-view-sub { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 28px; opacity: 0.7; }

  .fav-coll-section {
    margin-bottom: 20px;
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: var(--card-radius);
    overflow: hidden;
    animation: fadeUp 0.25s ease;
  }

  .fav-coll-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .fav-coll-header:hover { background: var(--color-bg); }
  .fav-coll-section.expanded .fav-coll-header { border-bottom: 1px solid var(--color-border); }
  .fav-coll-name {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--color-text-main);
    flex: 1;
  }
  .fav-coll-badge {

function loadCustomWheelOptions() {
  try {
    const raw = localStorage.getItem(DECIDE_CUSTOM_OPTIONS_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed)
      ? parsed.map(normalizeCustomWheelOption).filter(Boolean).slice(0, 18)
      : [];
  } catch {
    return [];
  }
}

function saveCustomWheelOptions(options) {
  try { localStorage.setItem(DECIDE_CUSTOM_OPTIONS_KEY, JSON.stringify(options)); } catch {}
}

function normalizeCustomWheelOption(value) {
  const cleaned = String(value || '').replace(/\s+/g, ' ').trim();
  if (!cleaned) return '';
  return cleaned.slice(0, 16);
}

function loadFavs() {
  try { const r = localStorage.getItem(FAVS_KEY); return r ? JSON.parse(r) : {}; } catch { return {}; }
}
function saveFavs(f) {
  try { localStorage.setItem(FAVS_KEY, JSON.stringify(f)); } catch {}
}
function favKey(name, address) {
  return (name || '').trim() + '||' + (address || '').trim();
}
function isFavorited(name, address) {
  const k = favKey(name, address);
  return Object.values(loadFavs()).some(list => list.some(r => favKey(r.name, r.address) === k));
}
function getRestaurantCollections(name, address) {
  const k = favKey(name, address), f = loadFavs();
  return Object.keys(f).filter(c => f[c].some(r => favKey(r.name, r.address) === k));
}
function setRestaurantInCollection(restaurant, collName, shouldAdd) {
  const f = loadFavs(), k = favKey(restaurant.name, restaurant.address);
  if (!f[collName]) f[collName] = [];
  const idx = f[collName].findIndex(r => favKey(r.name, r.address) === k);
  if (shouldAdd) {
    if (idx === -1) f[collName].push({ name: restaurant.name, rating: restaurant.rating, address: restaurant.address, mapUrl: restaurant.mapUrl, savedAt: Date.now() });
  } else {
    if (idx !== -1) f[collName].splice(idx, 1);
    if (f[collName].length === 0) delete f[collName];
  }
  saveFavs(f);
}
function addToNewCollection(collName, restaurant) {
  collName = collName.trim(); if (!collName) return false;
  const f = loadFavs(), k = favKey(restaurant.name, restaurant.address);
  if (!f[collName]) f[collName] = [];
  let added = false;
  if (!f[collName].some(r => favKey(r.name, r.address) === k)) {
    f[collName].push({ name: restaurant.name, rating: restaurant.rating, address: restaurant.address, mapUrl: restaurant.mapUrl, savedAt: Date.now() });
    added = true;
  }
  saveFavs(f); return added;
}

function guessGeoLabel(data) {
  if (!data) return '';
  if (data.city && data.region) return `${data.region} · ${data.city}`;
  if (data.city) return data.city;
  if (data.region) return data.region;
  if (data.label && typeof data.label === 'string') return data.label;
  if (Number.isFinite(data.lat) && Number.isFinite(data.lng)) return '你的当前位置';
  return '';
}

function textLooksLikeHasLocation(text) {
  const raw = String(text || '').trim();
  if (!raw) return false;
  if (/(附近|周边|定位|当前位置|location|city|near|around|district)/i.test(raw)) return true;
  if (/\b\d{1,3}\.\d{3,}\s*,\s*\d{1,3}\.\d{3,}\b/.test(raw)) return true;
  if (/(?:在|去|到|near|around|in|at)\s*[A-Za-z\u4e00-\u9fa5]{2,}/i.test(raw)) return true;
  if (/[\u4e00-\u9fa5]{2,}(市|区|县|镇|乡|村|路|街|道|巷|里|湾|站|机场|公园|广场|商圈|新城|外滩|三里屯)/.test(raw)) return true;
  if (/\b[A-Za-z][A-Za-z\s'-]{2,}\s(city|district|downtown|uptown|center|centre|cbd)\b/i.test(raw)) return true;
  const named = ['柏林', 'Berlin', '上海', '北京', '广州', '深圳', '杭州', '南京', '武汉', '西安', '重庆', '天津', '苏州', '成都', '纽约', '伦敦', '巴黎', '东京', 'Shanghai', 'Beijing', 'Guangzhou', 'Shenzhen', 'Hangzhou', 'Nanjing', 'Wuhan', 'Chongqing', 'Tianjin', 'Suzhou', 'Chengdu', 'New York', 'London', 'Paris', 'Tokyo'];
  return named.some(loc => raw.toLowerCase().includes(String(loc).toLowerCase()));
}

function buildRecommendInputWithGeo(text) {
  if (currentMode !== 'recommend') return text;
  if (geoStatus !== 'ready' || !geoData) return text;
  if (textLooksLikeHasLocation(text)) return text;
  const label = guessGeoLabel(geoData) || '我的当前位置';
  return `${text}\n\n补充定位参考：我当前在${label}。请优先推荐附近可步行或短途可达的餐厅，不要跨城市或跨国家推荐。若附近该细分菜系选择不多，请先在附近范围内联想放宽到相近菜系（例如细分中餐→中餐→亚洲菜），并用一句自然话说明已做就近放宽。若我手动补充了其他地点，请以我手动输入为准。`;
}

function refreshRecommendWelcomeIfNeeded() {

  const session = getCurrentSession();
  if (!session || session.messages.length === 0) renderMessages();
}

function getGeoHintText() {
  if (currentMode !== 'recommend') return '';
  if (geoStatus === 'requesting') return '正在获取当前位置…';
  if (geoStatus === 'ready' && geoData) {
    return `已获取默认位置：${guessGeoLabel(geoData) || '你的当前位置'}。你仍可随时手动输入其他城市或区域，且手动输入始终优先。`;
  }
  if (geoStatus === 'denied') return '你已拒绝定位权限，没关系，直接输入城市也可以（例如：上海静安）。';
  if (geoStatus === 'error') return `定位暂不可用（${geoError || '未知原因'}），你仍可直接输入城市继续。`;
  return '可选：点击「📍 使用当前位置」让我更快定位到你附近的推荐。';
}

    hint.textContent = '';
    hint.style.display = 'none';
    return;

  hint.textContent = getGeoHintText();

async function reverseGeocode(lat, lng) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 4500);
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}&zoom=12&addressdetails=1`;
    const res = await fetch(url, {
      headers: { 'Accept-Language': 'zh-CN,en' },
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('reverse geocode failed');
    const data = await res.json();
    const addr = data && data.address ? data.address : {};
    const city = addr.city || addr.town || addr.county || addr.state || '';
    const region = addr.suburb || addr.borough || addr.city_district || addr.state_district || '';
    const country = addr.country || '';
    const countryCode = addr.country_code || '';
    return { city: city || '', region: region || '', country: country || '', countryCode: countryCode || '' };
  } finally {
    clearTimeout(timer);
  }
}

function requestGeolocation(options = {}) {
  const onSuccess = typeof options.onSuccess === 'function' ? options.onSuccess : null;
  const onError = typeof options.onError === 'function' ? options.onError : null;
  let callbackDone = false;
  const finishSuccess = () => {
    if (callbackDone) return;
    callbackDone = true;
    if (onSuccess) onSuccess();
  };
  const finishError = (reason) => {
    if (callbackDone) return;
    callbackDone = true;
    if (onError) onError(reason);
  };
  if (!navigator.geolocation) {
    geoStatus = 'error';
    geoError = '当前浏览器不支持定位';
    updateGeoHintUI();
    refreshRecommendWelcomeIfNeeded();
    if (currentView === 'chat' && currentMode === 'decide') renderMessages();
    finishError('unsupported');
    return;
  }
  if (geoStatus === 'requesting') {
    finishError('pending');
    return;
  }
  geoStatus = 'requesting';
  geoError = '';
  updateGeoHintUI();
  refreshRecommendWelcomeIfNeeded();
  if (currentView === 'chat' && currentMode === 'decide') renderMessages();
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    geoStatus = 'ready';
    geoData = {
      lat,
      lng,
      accuracy: pos.coords.accuracy,
      city: '',
      region: '',
      country: '',
      countryCode: '',
      label: '你的当前位置'
    };
    updateGeoHintUI();
    refreshRecommendWelcomeIfNeeded();
    if (currentView === 'chat' && currentMode === 'decide') renderMessages();
    finishSuccess();
    try {
      const named = await reverseGeocode(lat, lng);
      if (geoStatus !== 'ready' || !geoData) return;
      geoData.city = named.city || '';
      geoData.region = named.region || '';
      geoData.country = named.country || '';
      geoData.countryCode = named.countryCode || '';
      geoData.label = guessGeoLabel(geoData);
      updateGeoHintUI();
      refreshRecommendWelcomeIfNeeded();
      if (currentView === 'chat' && currentMode === 'decide') renderMessages();
    } catch {}
  }, (err) => {
    if (err && err.code === 1) {
      geoStatus = 'denied';
      geoError = '用户拒绝授权';
    } else if (err && err.code === 3) {
      geoStatus = 'error';
      geoError = '定位超时';
    } else {
      geoStatus = 'error';
      geoError = '定位失败';
    }
    updateGeoHintUI();
    refreshRecommendWelcomeIfNeeded();
    if (currentView === 'chat' && currentMode === 'decide') renderMessages();
    finishError('failed');
  }, {
    enableHighAccuracy: false,
    timeout: 8000,
    maximumAge: 300000
  });
}

function isRateLimitError(text) {
  const lower = text.toLowerCase();
  return lower.includes('error in workflow') || lower.includes('rate limit') || lower.includes('too many requests');
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffleArray(arr) {
  const copied = [...arr];
  for (let i = copied.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copied[i], copied[j]] = [copied[j], copied[i]];
  }
  return copied;
}

function pickNoRepeatDecision(candidates) {
  const source = candidates.length > 0 ? candidates : DECIDE_DECISION_POOL;
  const fresh = source.filter(item => !decideRecentResultIds.includes(item.id));
  const chosen = pickRandom(fresh.length > 0 ? fresh : source);
  decideRecentResultIds.push(chosen.id);
  if (decideRecentResultIds.length > 14) decideRecentResultIds.shift();
  return chosen;
}

function hasGuidedDecideSelection() {
  return decideSelections.mealType !== '随便' || decideSelections.mood !== '随便' || decideSelections.scene !== '不确定';
}

function buildGuidedWheelEntries() {
  const hasSelection = hasGuidedDecideSelection();
  const custom = decideCustomOptions.map(normalizeCustomWheelOption).filter(Boolean);
  if (!hasSelection && custom.length === 0) return null;

  const weighted = new Map();
  const order = [];
  const addMany = (items, weight) => {
    (items || []).forEach(item => {
      const key = normalizeCustomWheelOption(item);
      if (!key) return;
      if (!weighted.has(key)) order.push(key);
      weighted.set(key, (weighted.get(key) || 0) + weight);
    });
  };

  addMany(DECIDE_MEAL_OPTION_MAP[decideSelections.mealType], 3);
  addMany(DECIDE_MOOD_OPTION_MAP[decideSelections.mood], 2);
  addMany(DECIDE_SCENE_OPTION_MAP[decideSelections.scene], 2);
  addMany(custom, 4);

  const fallbackPool = [
    ...custom,
    ...(DECIDE_MEAL_OPTION_MAP[decideSelections.mealType] || []),
    ...(DECIDE_MOOD_OPTION_MAP[decideSelections.mood] || []),
    ...(DECIDE_SCENE_OPTION_MAP[decideSelections.scene] || []),
    ...DECIDE_GENERAL_FILLERS
  ].map(normalizeCustomWheelOption).filter(Boolean);

  const ranked = order
    .sort((a, b) => {
      const diff = (weighted.get(b) || 0) - (weighted.get(a) || 0);
      return diff !== 0 ? diff : Math.random() - 0.5;
    });
  const targetCount = Math.min(8, Math.max(6, Math.max(ranked.length, custom.length ? 6 : 0)));
  const picked = ranked.slice(0, targetCount);

  shuffleArray(fallbackPool).forEach(item => {
    if (picked.length >= targetCount) return;
    if (!picked.includes(item)) picked.push(item);
  });

  return shuffleArray(picked.slice(0, 8)).map(direction => (
    createDecideEntry(`今天签到了：${direction}`, direction, ['guided'])
  ));
}

function createWheelOptions() {
  const guided = buildGuidedWheelEntries();
  if (guided && guided.length > 0) return guided;
  const copied = [...DECIDE_DECISION_POOL];
  copied.sort(() => Math.random() - 0.5);
  return copied.slice(0, 8);
}

function ensureWheelOptions() {
  if (decideWheelOptions.length === 0) decideWheelOptions = createWheelOptions();
}

function clearDecideWheelTimer() {
  if (!decideWheelTimer) return;
  clearTimeout(decideWheelTimer);
  decideWheelTimer = null;
}

function resetDecideStarter() {
  clearDecideWheelTimer();
  decideResult = null;
  decideWheelRotation = 0;
  decideWheelHighlight = -1;
  decideWheelSpinning = false;
  decideWheelOptions = createWheelOptions();
}

function updateDecideWheelFromCurrentState(options = {}) {
  clearDecideWheelTimer();
  decideWheelSpinning = false;
  decideWheelOptions = createWheelOptions();
  decideWheelHighlight = -1;
  if (options.resetRotation !== false) decideWheelRotation = 0;
  if (!options.keepResult) decideResult = null;
}

function setDecideSelection(key, value) {
  if (!Object.prototype.hasOwnProperty.call(decideSelections, key)) return;
  decideSelections[key] = value;
  updateDecideWheelFromCurrentState();
  if (currentView === 'chat' && decideStarterActive) renderMessages();
}

function addCustomDecideOption(value) {
  const normalized = normalizeCustomWheelOption(value);
  if (!normalized) return false;
  if (decideCustomOptions.includes(normalized)) return false;
  decideCustomOptions = [...decideCustomOptions, normalized].slice(0, 18);
  saveCustomWheelOptions(decideCustomOptions);
  updateDecideWheelFromCurrentState();
  return true;
}

function removeCustomDecideOption(value) {
  decideCustomOptions = decideCustomOptions.filter(item => item !== value);
  saveCustomWheelOptions(decideCustomOptions);
  updateDecideWheelFromCurrentState();
}

function filterDecidePoolByLabel(label) {
  const tagMap = {
    '想吃热乎的': ['hot', 'comfort'],
    '想吃便宜点': ['cheap'],
    '想吃开心一点': ['happy', 'group', 'heavy'],
    '想吃清淡点': ['light', 'solo'],
    '想吃有氛围的': ['vibe', 'date']
  };
  const tags = tagMap[label] || ['random'];
  const candidates = DECIDE_DECISION_POOL.filter(item => item.tags.some(tag => tags.includes(tag)));
  return candidates.length > 0 ? candidates : DECIDE_DECISION_POOL;
}

function buildDecideResultReason(direction) {
  const meal = decideSelections.mealType;
  const mood = decideSelections.mood;
  const scene = decideSelections.scene;
  const dir = String(direction || '');

  if (meal === '夜宵' && /(拉面|麻辣烫|烧烤|汤粉|面|便利店热食)/.test(dir)) return '适合深夜吃点热乎的，不用想太多也能立刻被安慰到。';
  if (meal === '下午茶' && /(咖啡|甜点|蛋糕|冰淇淋|奶茶)/.test(dir)) return '适合把这一顿留给一点轻松和甜味，刚好当作今天的小奖励。';
  if (meal === '早餐' && /(粥|包子|面包|三明治|咖啡)/.test(dir)) return '适合把这一天温柔地开个头，轻一点也更容易做决定。';
  if (scene === '赶时间' && /(快餐|盖饭|三明治|咖啡|面)/.test(dir)) return '适合快速解决一顿，不耽误节奏，也不容易踩空。';
  if (scene === '约会' && /(bistro|意面|日料|brunch|甜点)/i.test(dir)) return '适合慢慢吃一顿，气氛和分寸都比较在线。';
  if (scene === '和朋友' && /(火锅|烧烤|韩餐|川菜|披萨)/.test(dir)) return '适合边吃边聊，热闹感和分享感都会更到位。';
  if (scene === '一个人' && /(拉面|盖饭|面|轻食|快餐)/.test(dir)) return '适合一个人稳稳吃完，不用纠结，也不会有压力。';
  if (mood === '热乎' && /(火锅|面|拉面|粥|汤粉|麻辣烫)/.test(dir)) return '适合现在这种想吃点热乎、让人缓一口气的时候。';
  if (mood === '便宜' && /(盖饭|面|快餐|包子|便利店热食)/.test(dir)) return '适合预算友好地解决这一顿，省心也很稳。';
  if (mood === '精致一点' && /(brunch|日料|意面|bistro|甜点)/i.test(dir)) return '适合把这顿吃得讲究一点，仪式感会刚刚好。';
  if (mood === '清淡' && /(轻食|粥|越南粉|日料|汤面)/.test(dir)) return '适合今天想吃得轻一点，胃口和状态都能被照顾到。';
  if (mood === '重口' && /(川菜|火锅|烧烤|麻辣烫|韩餐)/.test(dir)) return '适合来点更有存在感的味道，一口下去比较容易满足。';

  const parts = [];
  if (meal !== '随便') parts.push(`${meal}这顿`);
  if (scene !== '不确定') parts.push(scene === '赶时间' ? '赶一点时间' : scene);
  if (mood !== '随便') parts.push(`想吃${mood}`);
  if (parts.length > 0) return `适合现在这种${parts.join('、')}的时候，选它会更容易下决定。`;
  return '适合现在这种不想继续纠结的时候，顺着这张签去吃通常不会太错。';
}

function buildDecideResult(source, fixedEntry) {
  const picked = fixedEntry || pickNoRepeatDecision(source === 'default' ? DECIDE_DECISION_POOL : decideWheelOptions);
  return {
    id: picked.id,
    source,
    text: `今天签到了：${picked.direction}`,
    direction: picked.direction,
    note: buildDecideResultReason(picked.direction)
  };
}

function buildCuisineFallbackHint(direction) {
  const d = String(direction || '').trim();
  if (!d) return '';
  const chainMap = [
    { keys: ['西北菜'], chain: '西北菜 -> 中餐 -> 亚洲菜' },
    { keys: ['潮汕菜'], chain: '潮汕菜 -> 粤菜 -> 中餐' },
    { keys: ['韩餐', '韩国'], chain: '韩餐 -> 亚洲菜' },
    { keys: ['川菜', '湘菜', '云贵', '云南菜', '贵州菜', '东北菜', '江浙菜', '粤菜', '客家菜', '新疆菜', '中餐'], chain: `${d} -> 中餐 -> 亚洲菜` },
    { keys: ['日料', '日式'], chain: '日料 -> 亚洲菜' },
    { keys: ['东南亚', '南亚', '泰餐', '越南', '印度'], chain: `${d} -> 亚洲菜` },
    { keys: ['法餐', '意餐', '地中海'], chain: `${d} -> 西式餐饮` }
  ];
  const matched = chainMap.find(item => item.keys.some(k => d.includes(k)));
  return matched ? matched.chain : `${d} -> 相近风味 -> 更宽泛品类`;
}

function buildCuisineFallbackChain(direction) {
  const d = String(direction || '').trim();
  if (!d) return [];
  if (d.includes('新疆菜')) return ['新疆菜', '中餐', '亚洲菜'];
  if (d.includes('西北菜')) return ['西北菜', '中餐', '亚洲菜'];
  if (d.includes('潮汕菜')) return ['潮汕菜', '粤菜', '中餐'];
  if (d.includes('韩餐') || d.includes('韩国')) return ['韩餐', '亚洲菜'];
  if (d.includes('南亚') || d.includes('印度')) return ['南亚菜', '亚洲菜'];
  if (d.includes('东南亚') || d.includes('泰') || d.includes('越南')) return ['东南亚菜', '亚洲菜'];
  if (d.includes('日料') || d.includes('日式')) return ['日料', '亚洲菜'];
  if (d.includes('中餐') || d.includes('川菜') || d.includes('湘菜') || d.includes('粤菜') || d.includes('江浙') || d.includes('东北菜') || d.includes('云南菜') || d.includes('贵州菜') || d.includes('客家菜')) {
    return [d, '中餐', '亚洲菜'];
  }
  return [d, '相近口味', '亚洲菜'];
}

function cloneGeoSnapshot() {
  if (!geoData) return null;
  return {
    city: geoData.city || '',
    region: geoData.region || '',
    country: geoData.country || '',
    countryCode: geoData.countryCode || '',
    label: guessGeoLabel(geoData) || '你的当前位置'
  };
}

function normalizeTxt(s) {
  return String(s || '').toLowerCase();
}

function includesLocalToken(hay, token) {
  if (!token) return false;
  const h = normalizeTxt(hay);
  const t = normalizeTxt(token);
  return !!t && h.includes(t);
}

function isRestaurantWithinGeoLock(rest, geoSnapshot) {
  if (!rest || !geoSnapshot) return false;
  const raw = `${rest.address || ''} ${rest.mapUrl || ''}`.trim();
  if (!raw) return false;
  const hasCity = includesLocalToken(raw, geoSnapshot.city);
  const hasRegion = includesLocalToken(raw, geoSnapshot.region);
  if (!hasCity && !hasRegion) return false;
  const lower = normalizeTxt(raw);
  if (geoSnapshot.countryCode && geoSnapshot.countryCode !== 'us') {
    if (/(usa|united states|u\.s\.|u\.s\.a\.|america)/i.test(lower)) return false;
  }
  if (geoSnapshot.country && !includesLocalToken(raw, geoSnapshot.country)) {
    const countryMentions = ['germany', 'deutschland', 'china', '中国', 'japan', 'japan', 'france', 'uk', 'united kingdom', 'usa', 'united states'];
    const mentioned = countryMentions.find(c => lower.includes(c));
    if (mentioned) return false;
  }
  return true;
}

function formatRestaurantsAsText(restaurants, leadText) {
  const intro = leadText ? `${leadText}\n\n` : '';
  const blocks = restaurants.map(r => {
    const lines = [`🍽️ **${r.name || '推荐餐厅'}**`];
    if (r.rating && r.ratingCount) lines.push(`⭐ ${r.rating}（${r.ratingCount}）`);
    else if (r.rating) lines.push(`⭐ ${r.rating}`);
    if (r.address) lines.push(`📍 ${r.address}`);
    if (r.hours) lines.push(`🕐 ${r.hours}`);
    if (r.suitableReason) lines.push(`适合你：${r.suitableReason}`);
    if (r.warmRecommendation) lines.push(`一句有温度的推荐语：${r.warmRecommendation}`);
    else if (r.quote) lines.push(`💬 ${r.quote}`);
    if (r.reviewSignal) lines.push(`小提醒：${r.reviewSignal}`);
    if (r.mapUrl) lines.push(`[查看 Google Maps](${r.mapUrl})`);
    return lines.join('\n');
  });
  return `${intro}${blocks.join('\n\n')}`.trim();
}

function buildFriendlyCuisineShiftLine(fromCuisine, toCuisine) {
  if (!fromCuisine || !toCuisine || fromCuisine === toCuisine) return '';
  if (toCuisine === '中餐') return `你附近正宗${fromCuisine}不太多，我先帮你找些更接近这个口味的中餐～`;
  if (toCuisine === '亚洲菜') return `这一带${fromCuisine}选择比较少，我先换个更接近的亚洲口味帮你找找看。`;
  return `这附近${fromCuisine}选择有点少，我先帮你找些更接近这个口味的${toCuisine}～`;
}

function extractCuisineFromText(text) {
  const raw = String(text || '');
  const keys = ['新疆菜', '西北菜', '潮汕菜', '韩餐', '南亚菜', '东南亚菜', '日料', '中餐', '川菜', '湘菜', '粤菜', '江浙菜'];
  return keys.find(k => raw.includes(k)) || '';
}

function buildStrictLocalCuisinePrompt(stepCuisine, rootCuisine, geoSnapshot) {
  const geoLabel = geoSnapshot && geoSnapshot.label ? geoSnapshot.label : '我的当前位置';
  return `请为我推荐${geoLabel}附近可到达的${stepCuisine}餐厅（原始偏好：${rootCuisine}）。
要求：
1) 仅限同城且短途可达，不得跨城市，不得跨国家；
2) 如果不满足“本地可到达”，宁可少给，也不要给远距离结果；
3) 输出格式保持餐厅卡片可解析（🍽️/⭐/📍/Google Maps）。`;
}

async function runStrictLocalCuisineSearch(task, sessionSid) {
  const geoSnapshot = task && task.geoSnapshot ? task.geoSnapshot : cloneGeoSnapshot();
  const rootCuisine = task && task.direction ? task.direction : '';
  if (!geoSnapshot || !rootCuisine) return null;
  const chain = buildCuisineFallbackChain(rootCuisine);
  let lastLocalRestaurants = [];
  let lastStepCuisine = '';
  for (let i = 0; i < chain.length; i++) {
    const stepCuisine = chain[i];
    const prompt = buildStrictLocalCuisinePrompt(stepCuisine, rootCuisine, geoSnapshot);
    const output = await callAPI(prompt, sessionSid);
    const parsed = parseRestaurants(output);
    const localRestaurants = parsed.restaurants.filter(r => isRestaurantWithinGeoLock(r, geoSnapshot));
    if (localRestaurants.length > 0) {
      const lead = i > 0 ? buildFriendlyCuisineShiftLine(rootCuisine, stepCuisine) : '';
      return formatRestaurantsAsText(localRestaurants, lead);
    }
    lastLocalRestaurants = localRestaurants;
    lastStepCuisine = stepCuisine;
  }
  if (lastLocalRestaurants.length > 0) {
    return formatRestaurantsAsText(lastLocalRestaurants, buildFriendlyCuisineShiftLine(rootCuisine, lastStepCuisine));
  }
  return `我在你附近认真找过啦，这一带这个口味确实比较少。要不你换一个附近区域，我继续帮你找找？`;
}

function buildFindByCuisinePrompt(result) {
  const direction = result && result.direction ? result.direction : '今天状态合适的方向';
  const geoLabel = geoStatus === 'ready' && geoData ? guessGeoLabel(geoData) : '';
  if (geoLabel) {
    const fallbackHint = buildCuisineFallbackHint(direction);
    return `请按「${direction}」这个方向，推荐我当前位置（${geoLabel}）附近可到达的餐厅。
【硬性约束】只允许同城且短途可达（步行/公共交通/打车约30分钟内），严禁跨城市或跨国家推荐。
【降级策略】若附近${direction}选择不多，只能在本地范围内按这个链路放宽：${fallbackHint}；可以放宽菜系，不可以放宽距离。
【输出要求】若触发放宽，用一句自然中文简短说明“附近该细分选择不多，已帮你放宽到更接近方向”，再给附近候选。`;
  }
  return `请按「${direction}」这个方向推荐餐厅。`;
}

function buildFindByCuisineUserPrompt(result) {
  const direction = result && result.direction ? result.direction : '这类';
  return `帮我找附近可到达的${direction}餐厅～`;
}

function prefillManualCityPromptByDecide(result) {
  const direction = result && result.direction ? result.direction : '今天状态合适的方向';
  const inp = document.getElementById('inp');
  if (!inp) return;
  inp.value = `按「${direction}」这个方向帮我找餐厅，城市：`;
  resize(inp);
  inp.focus();
}

function chooseDecideChip(label) {
  if (label === '完全随机') return;
  const picked = pickNoRepeatDecision(filterDecidePoolByLabel(label));
  decideResult = {
    id: picked.id,
    source: 'chip',
    text: `今天签到了：${picked.direction}`,
    direction: picked.direction,
    note: buildDecideResultReason(picked.direction)
  };
  decideWheelHighlight = -1;
  if (currentView === 'chat' && decideStarterActive) renderMessages();
}

function runDecideWheel(welcomeEl) {
  if (decideWheelSpinning) return;
  ensureWheelOptions();
  decideWheelSpinning = true;
  const wheel = welcomeEl.querySelector('.decide-wheel');
  const segCount = decideWheelOptions.length;
  const step = 360 / segCount;
  const picked = pickNoRepeatDecision(decideWheelOptions);
  const idx = decideWheelOptions.findIndex(item => item.id === picked.id);
  const centerAngle = idx * step + step / 2;
  const alignToPointer = 360 - centerAngle;
  const jitter = Math.random() * 8 - 4;
  const targetRotation = decideWheelRotation + 1260 + alignToPointer + jitter;
  if (wheel) {
    wheel.style.transition = 'transform 1500ms cubic-bezier(0.2, 0.8, 0.15, 1)';
    requestAnimationFrame(() => { wheel.style.transform = `rotate(${targetRotation}deg)`; });
  }
  clearDecideWheelTimer();
  decideWheelTimer = setTimeout(() => {
    decideWheelSpinning = false;
    decideWheelRotation = targetRotation;
    decideWheelHighlight = idx;
    decideResult = buildDecideResult('wheel', picked);
    renderMessages();
  }, 1550);
}

function openDecideStarter() {
  currentMode = 'decide';
  decideStarterActive = true;
  resetDecideStarter();
  syncModeUI();
  if (currentView === 'chat') renderMessages();
}

function syncModeUI() {
  const inp = document.getElementById('inp');
  if (inp) inp.placeholder = currentMode === 'decide' ? DECIDE_PLACEHOLDER : RECOMMEND_PLACEHOLDER;
  const modeSwitch = document.getElementById('modeSwitch');
  if (modeSwitch) {
    modeSwitch.querySelectorAll('.mode-switch-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === currentMode);
    });
  }
  updateGeoHintUI();
}

function setAppMode(mode) {
  if (mode !== 'recommend' && mode !== 'decide') return;
  if (mode === 'decide') {
    openDecideStarter();
    return;
  }
  const shouldRender = currentMode !== 'recommend' || decideStarterActive;
  currentMode = 'recommend';
  decideStarterActive = false;
  clearDecideWheelTimer();
  decideWheelSpinning = false;
  syncModeUI();
  if (currentView === 'chat' && shouldRender) renderMessages();
}

function cancelSessionRename() {
  sessionRenamingId = null;
  sessionRenameDraft = '';
}

function saveSessionRename(id) {
  const session = sessions.find(s => s.id === id);
  if (!session) return;
  const nextTitle = sessionRenameDraft.trim();
  if (nextTitle) session.title = nextTitle.slice(0, 40);
  cancelSessionRename();
  saveSessions();
  renderSidebar();
}

function clampSidebarWidth(w) {
  return Math.max(SIDEBAR_MIN_WIDTH, Math.min(SIDEBAR_MAX_WIDTH, w));
}

function loadSidebarWidth() {
  try {
    const raw = localStorage.getItem(SIDEBAR_WIDTH_KEY);
    const parsed = raw ? parseInt(raw, 10) : 240;
    sidebarWidth = clampSidebarWidth(Number.isFinite(parsed) ? parsed : 240);
  } catch {
    sidebarWidth = 240;
  }
}

function applySidebarWidth() {
  const sidebar = document.getElementById('sidebar');
  if (!sidebar) return;
  if (window.innerWidth < 900) {
    sidebar.style.width = '';
    return;
  }
  if (sidebar.classList.contains('collapsed')) {
    sidebar.style.width = '0px';
    return;
  }
  sidebar.style.width = `${clampSidebarWidth(sidebarWidth)}px`;
}

function saveSidebarWidth() {
  try { localStorage.setItem(SIDEBAR_WIDTH_KEY, String(clampSidebarWidth(sidebarWidth))); } catch {}
}

function initSidebarResize() {
  const resizer = document.getElementById('sidebarResizer');
  const sidebar = document.getElementById('sidebar');
  if (!resizer || !sidebar) return;

  resizer.addEventListener('mousedown', e => {
    if (window.innerWidth < 900) return;
    if (sidebar.classList.contains('collapsed')) return;
    isSidebarResizing = true;
    document.body.classList.add('resizing-sidebar');
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!isSidebarResizing) return;
    sidebarWidth = clampSidebarWidth(e.clientX);
    applySidebarWidth();
  });

  document.addEventListener('mouseup', () => {
    if (!isSidebarResizing) return;
    isSidebarResizing = false;
    document.body.classList.remove('resizing-sidebar');
    saveSidebarWidth();
  });

  window.addEventListener('resize', () => {
    if (window.innerWidth < 900 && isSidebarResizing) {
      isSidebarResizing = false;
      document.body.classList.remove('resizing-sidebar');
    }
    applySidebarWidth();
  });
}

/* ── SESSION MANAGEMENT ── */
function loadSessions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    sessions = Array.isArray(parsed) ? parsed : [];
  } catch {
    sessions = [];
  }
}

function saveSessions() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); } catch {}
}

function getCurrentSession() {
  return sessions.find(s => s.id === currentSessionId) || null;
}

function createNewSession() {
  cancelSessionRename();
  decideStarterActive = false;
  resetDecideStarter();
  const session = {
    id: 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
    title: '新对话',
    messages: [],
    sid: 'sid_' + Math.random().toString(36).substr(2, 9)
  };
  sessions.push(session);
  saveSessions();
  currentSessionId = session.id;
  showChatView();
  document.getElementById('inp').focus();
}

function switchSession(id) {
  if (id === currentSessionId && currentView === 'chat') return;
  cancelSessionRename();
  decideStarterActive = false;
  resetDecideStarter();
  currentSessionId = id;
  if (currentView !== 'chat') {
    showChatView();
  } else {
    renderMessages();
    renderSidebar();
  }
  if (window.innerWidth < 900) {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebarOverlay').classList.remove('visible');
  }
  document.getElementById('inp').focus();
}

function deleteSession(id) {
  if (sessionRenamingId === id) cancelSessionRename();
  const idx = sessions.findIndex(s => s.id === id);
  if (idx === -1) return;
  sessions.splice(idx, 1);
  saveSessions();
  if (id === currentSessionId) {
    if (sessions.length > 0) {
      currentSessionId = sessions[sessions.length - 1].id;
      renderMessages();
    } else {
      createNewSession();
      return;
    }
  }
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  if (!list) return;
  list.innerHTML = '';
  [...sessions].reverse().forEach(session => {
    const item = document.createElement('div');
    item.className = 'session-item' + (session.id === currentSessionId ? ' active' : '');
    const isEditing = sessionRenamingId === session.id;
    if (isEditing) item.classList.add('editing');

    if (isEditing) {
      const input = document.createElement('input');
      input.className = 'session-rename-input';
      input.value = sessionRenameDraft || session.title || '';
      input.maxLength = 40;

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'session-rename-cancel';
      cancelBtn.textContent = '✕';
      cancelBtn.title = '取消';
      cancelBtn.addEventListener('click', e => { e.stopPropagation(); cancelSessionRename(); renderSidebar(); });

      const saveBtn = document.createElement('button');
      saveBtn.className = 'session-rename-save';
      saveBtn.textContent = '✓';
      saveBtn.title = '保存';
      saveBtn.addEventListener('click', e => { e.stopPropagation(); saveSessionRename(session.id); });

      input.addEventListener('input', () => { sessionRenameDraft = input.value; });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); saveSessionRename(session.id); }
        if (e.key === 'Escape') { e.preventDefault(); cancelSessionRename(); renderSidebar(); }
      });
      input.addEventListener('click', e => e.stopPropagation());

      item.appendChild(input);
      item.appendChild(cancelBtn);
      item.appendChild(saveBtn);
      setTimeout(() => { input.focus(); input.select(); }, 0);
    } else {
      const titleEl = document.createElement('span');
      titleEl.className = 'session-title';
      titleEl.textContent = session.title;

      const editBtn = document.createElement('button');
      editBtn.className = 'session-edit';
      editBtn.textContent = '✎';
      editBtn.title = '重命名对话';
      editBtn.addEventListener('click', e => {
        e.stopPropagation();
        sessionRenamingId = session.id;
        sessionRenameDraft = session.title || '';
        renderSidebar();
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'session-del';
      delBtn.textContent = '×';
      delBtn.title = '删除此对话';
      delBtn.addEventListener('click', e => { e.stopPropagation(); deleteSession(session.id); });

      item.appendChild(titleEl);
      item.appendChild(editBtn);
      item.appendChild(delBtn);
      item.addEventListener('click', () => switchSession(session.id));
    }
    list.appendChild(item);
  });
  const favEntry = document.getElementById('favEntry');
  if (favEntry) favEntry.classList.toggle('active', currentView === 'favorites');
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (window.innerWidth < 900) {
    sidebar.classList.toggle('mobile-open');
    overlay.classList.toggle('visible');
  } else {
    sidebar.classList.toggle('collapsed');
    applySidebarWidth();
  }
}

/* ── RENDERING ── */
function renderMessages() {
  const c = document.getElementById('chatWrap');
  c.innerHTML = '';
  const session = getCurrentSession();
  const shouldShowDecideStarter = currentMode === 'decide' && decideStarterActive;
  if (!session || session.messages.length === 0 || shouldShowDecideStarter) {
    if (currentMode === 'decide') ensureWheelOptions();
    const welcome = document.createElement('div');
    welcome.className = 'welcome';

    const decideActive = currentMode === 'decide' ? ' active' : '';
    const modeSub = currentMode === 'decide'

    if (decideSelections.scene !== '不确定') decideSummaryBits.push(decideSelections.scene);
    if (decideCustomOptions.length > 0) decideSummaryBits.push(`自定义 ${decideCustomOptions.length} 项`);
    const decideSummaryText = decideSummaryBits.length > 0
      ? `这一盘会优先按 <strong>${esc(decideSummaryBits.join(' · '))}</strong> 来生成，再从里面挑 6-8 个方向。`

    const decideFiltersHtml = DECIDE_FILTER_GROUPS.map(group => `
      <div class="decide-filter-group">

    const wheelSegments = currentMode === 'decide'

          return `<div class="decide-wheel-seg${active}" style="--a:${angle}deg;"><span>${esc(item.direction)}</span></div>`;
        }).join('')
      : '';
    const decideWheelHtml = currentMode === 'decide' ? `
      <div class="decide-wheel-card">
        <div class="decide-wheel-head">命运签 · 今天吃什么</div>
        <div class="decide-wheel-sub">先轻轻筛一下，再让命运签替你把范围收窄一点。</div>
        <div class="decide-filter-panel">
          ${decideFiltersHtml}
        </div>
        <div class="decide-wheel-summary">${decideSummaryText}</div>
        <div class="decide-wheel-wrap">
          <div class="decide-wheel-pointer"></div>
          <div class="decide-wheel${decideWheelSpinning ? ' spinning' : ''}" style="transform: rotate(${decideWheelRotation}deg);">
            ${wheelSegments}
          </div>
          <div class="decide-wheel-center">食</div>
        </div>
        <div class="decide-wheel-controls">
          <button class="decide-cta-btn" data-decide-action="spin" ${decideWheelSpinning ? 'disabled' : ''}>${decideWheelSpinning ? '抽签中…' : '开始抽签'}</button>
          <button class="decide-ghost-btn" data-decide-action="refresh-wheel" ${decideWheelSpinning ? 'disabled' : ''}>换一盘选项</button>
        </div>
        <div class="decide-custom-panel">
          <div class="decide-custom-head">

          </div>

            ${decideCustomOptions.length > 0
              ? decideCustomOptions.map(option => `
                <span class="decide-custom-chip">
                  <span>${esc(option)}</span>
                  <button type="button" class="decide-custom-remove" aria-label="删除 ${esc(option)}" data-decide-remove-custom="${esc(option)}">×</button>
